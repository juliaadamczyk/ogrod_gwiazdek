deep} opacity=\"0.5\" />\n      </g>\n    ),\n  },\n\n  sloik: {\n    otworY: 11,\n    dnoArt: 47,\n    name: 'Słoik ze wstążką',\n    box: { x: 31, y: 44.5, size: 38 },\n    mouthArt: { x: 50, y: 8 },\n    spread: { rx: 25, ry: 31 },\n    capacity: 10,\n    defaultColor: '#b7e4c7',\n    art: (c) => (\n      <g>\n        <path d=\"M26 10 L26 30 C20 40 20 84 26 90 C34 96 66 96 74 90 C80 84 80 40 74 30 L74 10 Z\" fill={c.base} opacity=\"0.9\" />\n        <path d=\"M74 30 C80 40 80 84 74 90 C70 93 62 95 54 95 L54 12 L74 10Z\" fill={c.dark} opacity=\"0.75\" />\n        {shine(0.45)}\n        <rect x=\"24\" y=\"8\" width=\"52\" height=\"7\" rx=\"3.5\" fill={c.light} />\n        <path d=\"M18 56 C34 50 66 50 82 56 L82 66 C66 60 34 60 18 66 Z\" fill=\"#e63946\" />\n        <path d=\"M44 58 L34 48 L50 56 L66 48 L56 58 Z\" fill=\"#c1121f\" />\n      </g>\n    ),\n  },\n\n  papier: {\n    otworY: 17,\n    dnoArt: 80,\n    name: 'Papier ozdobny',\n    box: { x: 27, y: 37.8, size: 46 },\n    mouthArt: { x: 50, y: 17 },\n    spread: { rx: 30, ry: 27 },\n    capacity: 14,\n    defaultColor: '#e8c4b0',\n    art: (c) => (\n      <g>\n        {/* sylwetka stozka - gorna krawedz to tylny rant, widoczny za kwiatami */}\n        <path d=\"M12 17 A38 9 0 0 0 88 17 L56 84 C53 87 47 87 44 84 Z\" fill={c.deep} />\n        {/* przednia powierzchnia papieru */}\n        <path d=\"M12 17 A38 9 0 0 1 88 17 L56 84 C53 87 47 87 44 84 Z\" fill={c.base} />\n        {/* prawa strona ciemniejsza */}\n        <path d=\"M88 17 A38 9 0 0 1 50 26 L50 86 C53 86 55 85 56 84 Z\" fill={c.dark} />\n        {/* zalamania papieru zbiegajace sie do przewiazania */}\n        <path d=\"M26 22 L47 83 M50 26 L50 86 M74 22 L53 83\"\n          stroke={c.deep} strokeWidth=\"1.1\" opacity=\"0.35\" fill=\"none\" />\n        {/* sznurek - papier scisniety u dolu */}\n        <path d=\"M39 72 C44 76 56 76 61 72 M40 77 C45 81 55 81 60 77\"\n          stroke=\"#9c7a56\" strokeWidth=\"2.4\" fill=\"none\" strokeLinecap=\"round\" />\n        <path d=\"M46 80 L39 90 M54 80 L61 90\"\n          stroke=\"#9c7a56\" strokeWidth=\"1.7\" fill=\"none\" strokeLinecap=\"round\" />\n      </g>\n    ),\n  },\n\n  folia: {\n    otworY: 15,\n    dnoArt: 80,\n    name: 'Folia',\n    box: { x: 26, y: 36, size: 48 },\n    mouthArt: { x: 50, y: 15 },\n    spread: { rx: 31, ry: 26 },\n    capacity: 15,\n    defaultColor: '#f1faee',\n    art: (c) => (\n      <g>\n        <path d=\"M11 15 A39 9 0 0 0 89 15 L56 84 C53 87 47 87 44 84 Z\" fill={c.dark} opacity=\"0.42\" />\n        <path d=\"M11 15 A39 9 0 0 1 89 15 L56 84 C53 87 47 87 44 84 Z\" fill={c.base} opacity=\"0.6\" />\n        <path d=\"M25 21 L47 83 M52 24 L52 86 M75 21 L54 83\"\n          stroke=\"#fff\" strokeWidth=\"1.7\" opacity=\"0.75\" fill=\"none\" />\n        <path d=\"M39 72 C44 76 56 76 61 72 M40 77 C45 81 55 81 60 77\"\n          stroke=\"#f0b429\" strokeWidth=\"2.6\" fill=\"none\" strokeLinecap=\"round\" />\n        <path d=\"M46 80 L39 90 M54 80 L61 90\"\n          stroke=\"#f0b429\" strokeWidth=\"1.9\" fill=\"none\" strokeLinecap=\"round\" />\n      </g>\n    ),\n  },\n\n  koszyk: {\n    otworY: 27,\n    dnoArt: 59,\n    name: 'Koszyk',\n    box: { x: 27, y: 37.8, size: 46 },\n    mouthArt: { x: 50, y: 26 },\n    spread: { rx: 29, ry: 33 },\n    capacity: 14,\n    defaultColor: '#d9a066',\n    art: (c) => (\n      <g>\n        <path d=\"M22 26 C22 4 78 4 78 26\" fill=\"none\" stroke={c.dark} strokeWidth=\"7\" strokeLinecap=\"round\" />\n        <path d=\"M12 28 L24 88 C26 94 74 94 76 88 L88 28 Z\" fill={c.base} />\n        <path d=\"M50 94 C64 94 74 93 76 88 L88 28 L66 28 L58 92 C56 93 53 94 50 94Z\" fill={c.dark} />\n        {[38, 52, 66, 80].map((y) => (\n          <path key={y} d={`M${13 + (y - 28) * 0.16} ${y} L${87 - (y - 28) * 0.16} ${y}`} stroke={c.deep} strokeWidth=\"2.6\" opacity=\"0.55\" />\n        ))}\n        {[24, 38, 52, 66, 80].map((x) => (\n          <path key={x} d={`M${x} 28 L${x + (x - 50) * 0.22} 90`} stroke={c.deep} strokeWidth=\"2.2\" opacity=\"0.4\" />\n        ))}\n        <rect x=\"8\" y=\"22\" width=\"84\" height=\"10\" rx=\"5\" fill={c.light} />\n      </g>\n    ),\n  },\n}\n\n// Wylot wazonu w ukladzie sceny liczymy z pozycji na rysunku,\n// dzieki czemu lodygi zawsze trafiaja dokladnie w otwor - niezaleznie od rozmiaru wazonu.\nfor (const v of Object.values(VASES)) {\n  v.mouth = {\n    x: v.box.x + (v.mouthArt.x / 100) * v.box.size,\n    y: v.box.y + (v.mouthArt.y / 100) * v.box.size,\n  }\n  // punkt, w ktorym zbiegaja sie lodygi (dno wazonu / przewiazanie opakowania)\n  v.dno = v.box.y + (v.dnoArt / 100) * v.box.size\n}\n\nexport const VASE_IDS = Object.keys(VASES)\n\n// Kopula punktow kotwiczacych: srodek wyzej, brzegi nizej i szerzej (jak prawdziwy bukiet).\nexport function anchorsFor(vaseId) {\n  const v = VASES[vaseId] || VASES.wazon_kula\n  const { mouth, spread, capacity } = v\n  const GOLDEN = 2.399963229728653\n  return Array.from({ length: capacity }, (_, i) => {\n    const t = (i + 0.5) / capacity\n    const r = Math.sqrt(t)\n    const a = i * GOLDEN\n    return {\n      x: mouth.x + Math.cos(a) * r * spread.rx,\n      // srodek bukietu najwyzej, brzegi schodza tuz nad kant wazonu (0.30 * ry),\n      // dzieki czemu kwiaty siedza W wazonie, a nie wisza nad nim\n      y: mouth.y - spread.ry * (0.3 + 0.7 * (1 - r)),\n    }\n  })\n}\n\n// Wazon rysujemy DWA razy: raz caly (za lodygami) i raz sama jego przednia polowa\n// (przed lodygami). Dzieki temu tyl i wnetrze wazonu sa z tylu, a lodygi widac,\n// jak wchodza w otwor - zamiast urywac sie na kancie.\nexport function VaseArt({ id, color, size = 100, style, tylko }) {\n  const v = VASES[id] || VASES.wazon_kula\n  const rysunek = v.art(palette(color || v.defaultColor))\n  if (tylko !== 'przod') {\n    return (\n      <svg viewBox=\"0 0 100 100\" width={size} height={size} style={style} aria-hidden=\"true\">\n        {rysunek}\n      </svg>\n    )\n  }\n  const clipId = `wazon-przod-${id}`\n  return (\n    <svg viewBox=\"0 0 100 100\" width={size} height={size} style={style} aria-hidden=\"true\">\n      <defs>\n        <clipPath id={clipId}>\n          <rect x=\"-10\" y={v.otworY} width=\"120\" height={120 - v.otworY} />\n        </clipPath>\n      </defs>\n      <g clipPath={`url(#${clipId})`}>{rysunek}</g>\n    </svg>\n  )\n}\n\n// Wersja do miniaturek w panelu/sklepie - zachowuje proporcje\nexport function VaseThumb({ id, color, size = 56 }) {\n  const v = VASES[id] || VASES.wazon_kula\n  return (\n    <svg viewBox=\"0 0 100 100\" width={size} height={size} aria-hidden=\"true\">\n      {v.art(palette(color || v.defaultColor))}\n    </svg>\n  )\n}\n", "src/art/Table.jsx": "// Blat stolu widziany z boku (lekko z gory) - owal w fioletowo-zolte paski,\n// z widoczna gruboscia blatu. Wazon stoi NA blacie, bukiet rosnie nad nim.\nimport React from 'react'\n\n// Srodek blatu i jego promienie w ukladzie sceny (0-100)\nexport const BLAT = { cx: 50, cy: 79, rx: 38, ry: 11 }\n\nconst PASKI = 9\nconst FIOLET = ['#9b74d6', '#8a5fc9']\nconst ZOLTY = ['#ffd97a', '#f7c95c']\n\nexport function TableArt() {\n  const { cx, cy, rx, ry } = BLAT\n  const grubosc = 5\n  // Paski biegna w poprzek blatu; przy patrzeniu z boku sciskaja sie w pionie razem z owalem\n  const pasy = Array.from({ length: PASKI }, (_, i) => ({\n    y: cy - ry + (i * 2 * ry) / PASKI,\n    h: (2 * ry) / PASKI + 0.02,\n    fill: i % 2 ? FIOLET[(i >> 1) % 2] : ZOLTY[(i >> 1) % 2],\n  }))\n\n  return (\n    <svg viewBox=\"0 0 100 100\" className=\"table-svg\" aria-hidden=\"true\">\n      <defs>\n        <clipPath id=\"blat-obrys\">\n          <ellipse cx={cx} cy={cy} rx={rx} ry={ry} />\n        </clipPath>\n        <linearGradient id=\"bok-blatu\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n          <stop offset=\"0%\" stopColor=\"#7a4fb5\" />\n          <stop offset=\"100%\" stopColor=\"#4b2f74\" />\n        </linearGradient>\n        <radialGradient id=\"glebia-blatu\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n          <stop offset=\"52%\" stopColor=\"#3b2357\" stopOpacity=\"0\" />\n          <stop offset=\"100%\" stopColor=\"#3b2357\" stopOpacity=\"0.26\" />\n        </radialGradient>\n        <linearGradient id=\"polysk-blatu\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n          <stop offset=\"0%\" stopColor=\"#ffffff\" stopOpacity=\"0.3\" />\n          <stop offset=\"50%\" stopColor=\"#ffffff\" stopOpacity=\"0\" />\n        </linearGradient>\n      </defs>\n\n      {/* miekki cien na podlodze */}\n      <ellipse cx={cx} cy={cy + grubosc + 5} rx={rx * 0.94} ry={ry * 0.5} fill=\"#a9855f\" opacity=\"0.2\" />\n\n      {/* grubosc blatu - dolny owal wystaje spod gornego */}\n      <ellipse cx={cx} cy={cy + grubosc} rx={rx} ry={ry} fill=\"url(#bok-blatu)\" />\n\n      {/* powierzchnia blatu w paski */}\n      <g clipPath=\"url(#blat-obrys)\">\n        <rect x={cx - rx} y={cy - ry} width={rx * 2} height={ry * 2} fill=\"#f3e3bd\" />\n        {pasy.map((p, i) => (\n          <rect key={i} x={cx - rx} y={p.y} width={rx * 2} height={p.h} fill={p.fill} />\n        ))}\n      </g>\n\n      {/* przyciemnienie brzegow, zeby blat byl plaszczyzna, a nie naklejka */}\n      <ellipse cx={cx} cy={cy} rx={rx} ry={ry} fill=\"url(#glebia-blatu)\" />\n      <ellipse cx={cx} cy={cy} rx={rx} ry={ry} fill=\"url(#polysk-blatu)\" />\n\n      {/* kant blatu */}\n      <ellipse cx={cx} cy={cy} rx={rx} ry={ry} fill=\"none\" stroke=\"#6d47a6\" strokeWidth=\"1.1\" />\n      <path\n        d={`M${cx - rx} ${cy} A${rx} ${ry} 0 0 0 ${cx + rx} ${cy}`}\n        fill=\"none\"\n        stroke=\"#d3b6f5\"\n        strokeWidth=\"0.9\"\n        opacity=\"0.5\"\n      />\n    </svg>\n  )\n}\n\nexport function TrashArt({ open }) {\n  return (\n    <svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\" aria-hidden=\"true\">\n      <g transform={open ? 'translate(0 3)' : ''}>\n        <path d=\"M22 30 L28 88 C29 93 71 93 72 88 L78 30 Z\" fill=\"#8d9aa6\" />\n        <path d=\"M50 92 C62 92 71 91 72 88 L78 30 L62 30 L56 91 Z\" fill=\"#6e7c88\" />\n        <path d=\"M38 40 L41 82 M50 40 L50 82 M62 40 L59 82\" stroke=\"#5b6874\" strokeWidth=\"3\" strokeLinecap=\"round\" />\n      </g>\n      <g transform={open ? 'rotate(-18 22 24)' : ''}>\n        <rect x=\"16\" y=\"18\" width=\"68\" height=\"12\" rx=\"6\" fill=\"#aab6c1\" />\n        <rect x=\"40\" y=\"10\" width=\"20\" height=\"8\" rx=\"4\" fill=\"#aab6c1\" />\n      </g>\n    </svg>\n  )\n}\n", "src/art/stems.js": "// Jedna, uniwersalna lodyga: krzywa od wnetrza pojemnika do NASADY glowki kwiatu.\n// Pierwszy punkt kontrolny lezy wysoko NAD wylotem, wiec lodyga wychodzi z wazonu\n// pionowo (trzyma sie osi szyjki) i skreca do kwiatka dopiero ponad kantem.\n//\n// UWAGA: tylko dla kwiatow. Liscie maja wlasna galazke narysowana w ikonie,\n// wiec doklejanie im drugiej lodygi wygladaloby zle.\nimport { BY_ID, ROZMIAR_ELEMENTU, SRODEK_IKONY, NASADA_DOMYSLNA } from '../data/catalog'\n\nconst KOLORY = ['#5f8050', '#6f9160', '#7fa06d']\n\n// Gdzie dokladnie lodyga ma dotknac kwiatu. Punkt `nasada` jest podany\n// w jednostkach rysunku, wiec przeliczamy go na scene i obracamy razem z kwiatem -\n// dzieki temu np. tulipan zawsze ma lodyge u dolu kielicha, a nie z boku.\nfunction punktNasady(item) {\n  const n = BY_ID.flower[item.id]?.nasada || NASADA_DOMYSLNA\n  const jednostka = (ROZMIAR_ELEMENTU.flower / 100) * item.skala\n  const dx = (n.x - SRODEK_IKONY.x) * jednostka\n  const dy = (n.y - SRODEK_IKONY.y) * jednostka\n  const kat = (item.rot * Math.PI) / 180\n  return {\n    x: item.x + dx * Math.cos(kat) - dy * Math.sin(kat),\n    y: item.y + dx * Math.sin(kat) + dy * Math.cos(kat),\n  }\n}\n\nconst miedzy = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t })\n\nconst wysokoscW = (p, t) => {\n  const u = 1 - t\n  return u * u * u * p[0].y + 3 * u * u * t * p[1].y + 3 * u * t * t * p[2].y + t * t * t * p[3].y\n}\n\n// Najmniejsze t, przy ktorym krzywa przecina wysokosc wylotu wazonu.\nfunction tNaWysokosci(p, y) {\n  let poprzednia = wysokoscW(p, 0)\n  for (let i = 1; i <= 200; i += 1) {\n    const t = i / 200\n    const aktualna = wysokoscW(p, t)\n    if ((poprzednia - y) * (aktualna - y) <= 0) return t\n    poprzednia = aktualna\n  }\n  return 1\n}\n\n// Podzial krzywej (de Casteljau) - zwraca jej DRUGA polowe, od t do konca.\n// Dzieki temu kopia rysowana w warstwie kwiatu lezy dokladnie na oryginale,\n// zamiast byc osobna krzywa obok niego (stad braly sie podwojne lodygi).\nfunction drugaPolowa(p, t) {\n  const a = miedzy(p[0], p[1], t)\n  const b = miedzy(p[1], p[2], t)\n  const c = miedzy(p[2], p[3], t)\n  const d = miedzy(a, b, t)\n  const e = miedzy(b, c, t)\n  return [miedzy(d, e, t), e, c, p[3]]\n}\n\nconst zapisz = (p) => `M${p[0].x} ${p[0].y} C${p[1].x} ${p[1].y} ${p[2].x} ${p[2].y} ${p[3].x} ${p[3].y}`\n\nexport function sciezkiLodyg(items, usta, dno) {\n  return items\n    .filter((i) => i.kind === 'flower')\n    .map((i, idx) => {\n      const koniec = punktNasady(i)\n      const startX = usta.x + ((idx % 3) - 1) * 1.6\n      const punkty = [\n        { x: startX, y: dno },\n        { x: startX, y: usta.y - 16 },\n        { x: koniec.x * 0.72 + startX * 0.28, y: koniec.y + (usta.y - koniec.y) * 0.3 },\n        koniec,\n      ]\n      return {\n        uid: i.uid,\n        // pelna lodyga, rysowana POD wazonem\n        d: zapisz(punkty),\n        // ten sam odcinek od wylotu w gore - kopia w warstwie kwiatu\n        dNad: zapisz(drugaPolowa(punkty, tNaWysokosci(punkty, usta.y))),\n        z: i.z,\n        kolor: KOLORY[idx % KOLORY.length],\n      }\n    })\n}\n", "src/state/useGame.js": "import { useCallback, useEffect, useMemo, useRef, useState } from 'react'\nimport {\n  CATALOG_LIST,\n  BY_ID,\n  wycen,\n  NASADA_LISCIA,\n  LIMIT_KWIATOW,\n  LIMIT_LISCI,\n  LIMIT_DODATKOW,\n} from '../data/catalog'\nimport { anchorsFor, VASES } from '../art/vases'\n\nconst KEY = 'ogrod-gwiazdek-v1'\n\n// Domyslne warstwy: liscie z tylu, potem kwiaty, dodatki na wierzchu.\n// Kazdy element trzyma wlasne \"z\", wiec dziecko moze je dowolnie poprzekladac.\nconst BAZA_Z = { leaf: 1000, flower: 2000, extra: 3000 }\nconst MIN_Z = 100\nconst zDomyslne = (kind, i) => (BAZA_Z[kind] || 2000) + i\n\nfunction startoweOdblokowane() {\n  const out = {}\n  for (const [kind, list] of Object.entries(CATALOG_LIST)) {\n    out[kind] = list.filter((x) => x.start).map((x) => x.id)\n  }\n  return out\n}\n\nfunction stanPoczatkowy() {\n  return {\n    gwiazdki: 0,\n    odblokowane: startoweOdblokowane(),\n    kolekcja: [],\n    stol: { vaseId: 'wazon_kula', vaseColor: VASES.wazon_kula.defaultColor, items: [] },\n    sprzedanych: 0,\n  }\n}\n\n// Zapisy sprzed wprowadzenia warstw nie maja pola z - dokladamy je wg starej kolejnosci\nfunction zItemom(items) {\n  return items.map((i, idx) => (typeof i.z === 'number' ? i : { ...i, z: zDomyslne(i.kind, idx) }))\n}\n\nfunction uzupelnijZ(stol) {\n  return { ...stol, items: zItemom(stol.items || []) }\n}\n\nfunction wczytaj() {\n  try {\n    const raw = localStorage.getItem(KEY)\n    if (!raw) return stanPoczatkowy()\n    const zapis = JSON.parse(raw)\n    const baza = stanPoczatkowy()\n    return {\n      ...baza,\n      ...zapis,\n      // dokladamy elementy startowe, gdyby katalog urosl po ostatnim zapisie\n      odblokowane: Object.fromEntries(\n        Object.keys(baza.odblokowane).map((k) => [\n          k,\n          Array.from(new Set([...(baza.odblokowane[k] || []), ...((zapis.odblokowane || {})[k] || [])])),\n        ])\n      ),\n      stol: uzupelnijZ({ ...baza.stol, ...(zapis.stol || {}) }),\n      kolekcja: (zapis.kolekcja || []).map((k) => ({ ...k, items: zItemom(k.items || []) })),\n    }\n  } catch {\n    return stanPoczatkowy()\n  }\n}\n\nlet uidLicznik = 0\nconst nowyUid = () => `i${Date.now().toString(36)}${(uidLicznik++).toString(36)}`\n\nconst losowo = (a, b) => a + Math.random() * (b - a)\n\n// nic nie moze wyjechac poza stol\nconst wGranicach = (v) => (Number.isFinite(v) ? Math.min(97, Math.max(3, v)) : 50)\n\nexport function useGame() {\n  const [stan, setStan] = useState(wczytaj)\n  const zapisTimer = useRef(null)\n\n  // zapis do localStorage (z lekkim opoznieniem, zeby nie pisac przy kazdym pikselu przeciagania)\n  useEffect(() => {\n    clearTimeout(zapisTimer.current)\n    zapisTimer.current = setTimeout(() => {\n      try {\n        localStorage.setItem(KEY, JSON.stringify(stan))\n      } catch {\n        /* brak miejsca / tryb prywatny - gra dziala dalej, tylko bez zapisu */\n      }\n    }, 250)\n    return () => clearTimeout(zapisTimer.current)\n  }, [stan])\n\n  const { stol } = stan\n  const kotwice = useMemo(() => anchorsFor(stol.vaseId), [stol.vaseId])\n\n  const odblokowany = useCallback(\n    (kind, id) => (stan.odblokowane[kind] || []).includes(id),\n    [stan.odblokowane]\n  )\n\n  // --- Praca na stole ---\n\n  // Kazda kategoria ma WLASNA pule miejsc - zielen nie zabiera miejsca kwiatom.\n  const limitKwiatow = LIMIT_KWIATOW\n  const limitLisci = LIMIT_LISCI\n  const kwiatow = stol.items.filter((i) => i.kind === 'flower').length\n  const lisci = stol.items.filter((i) => i.kind === 'leaf').length\n  const dodatkow = stol.items.filter((i) => i.kind === 'extra').length\n\n  // Zwraca null gdy dodano, albo tekst komunikatu gdy sie nie zmiescilo.\n  const dodaj = useCallback(\n    (kind, id, color, punktWe) => {\n      if (kind === 'extra' && dodatkow >= LIMIT_DODATKOW) {\n        return 'Więcej dodatków się nie zmieści'\n      }\n      if (kind === 'flower' && kwiatow >= limitKwiatow) {\n        return `Więcej niż ${LIMIT_KWIATOW} kwiatów się nie zmieści`\n      }\n      if (kind === 'leaf' && lisci >= limitLisci) {\n        return `Więcej niż ${LIMIT_LISCI} liści się nie zmieści`\n      }\n      // odrzucamy punkt, ktorego nie da sie policzyc - inaczej kwiat wyladowalby w rogu ekranu\n      const punkt =\n        punktWe && Number.isFinite(punktWe.x) && Number.isFinite(punktWe.y) ? punktWe : null\n      setStan((s) => {\n        const kat = BY_ID[kind][id]\n        if (!kat) return s\n        const swobodny = kind === 'extra'\n        let baza = punkt\n        if (!baza && swobodny) {\n          // wstazki i drobiazgi ladują przy szyjce wazonu, nie w srodku bukietu\n          const usta = (VASES[s.stol.vaseId] || VASES.wazon_kula).mouth\n          baza = { x: usta.x + losowo(-7, 7), y: usta.y + losowo(-1, 7) }\n        }\n        if (!baza && kind === 'leaf') {\n          // Lisc ma wlasna galazke i obraca sie wokol nasady, wiec sadzimy go tak,\n          // zeby ta nasada wypadla w wylocie wazonu. Rozrzut robi obrot, nie pozycja.\n          const usta = (VASES[s.stol.vaseId] || VASES.wazon_kula).mouth\n          baza = { x: usta.x + losowo(-6, 6), y: usta.y - NASADA_LISCIA + losowo(-2, 2) }\n        }\n        if (!baza) {\n          const zajete = s.stol.items.filter((i) => i.kind === 'flower')\n          const wolne = kotwice.filter((k) => !zajete.some((i) => Math.hypot(i.x - k.x, i.y - k.y) < 7))\n          const pula = wolne.length ? wolne : kotwice\n          baza = pula[Math.floor(Math.random() * pula.length)]\n        }\n        const item = {\n          uid: nowyUid(),\n          kind,\n          id,\n          color: color || kat.kolor,\n          // losowy offset + losowy obrot => bukiet od razu wyglada naturalnie\n          x: wGranicach(baza.x + (punkt || kind !== 'flower' ? 0 : losowo(-3.2, 3.2))),\n          y: wGranicach(baza.y + (punkt || kind !== 'flower' ? 0 : losowo(-3.2, 3.2))),\n          rot: swobodny ? losowo(-12, 12) : losowo(-22, 22) * (kind === 'leaf' ? 1.15 : 1),\n          skala: (kat.skala || 1) * losowo(0.94, 1.06),\n          z: zDomyslne(kind, s.stol.items.length),\n        }\n        return { ...s, stol: { ...s.stol, items: [...s.stol.items, item] } }\n      })\n      return null\n    },\n    [kotwice, kwiatow, lisci, dodatkow, limitKwiatow, limitLisci]\n  )\n\n  const przesun = useCallback((uid, x, y) => {\n    setStan((s) => ({\n      ...s,\n      stol: {\n        ...s.stol,\n        items: s.stol.items.map((i) => (i.uid === uid ? { ...i, x: wGranicach(x), y: wGranicach(y) } : i)),\n      },\n    }))\n  }, [])\n\n  // Magnetyzm: po upuszczeniu blisko kotwicy kwiat \"wskakuje\" na nia (bez presji precyzji)\n  const upusc = useCallback(\n    (uid, x, y) => {\n      setStan((s) => {\n        const item = s.stol.items.find((i) => i.uid === uid)\n        if (!item) return s\n        let nx = x\n        let ny = y\n        // Magnetyzm dziala TYLKO dla kwiatow. Liscie i dodatki zostaja dokladnie\n        // tam, gdzie je puszczono - inaczej \"uciekaly\" spod palca.\n        if (item.kind === 'flower') {\n          let best = null\n          let bestD = Infinity\n          for (const k of kotwice) {\n            const d = Math.hypot(k.x - x, k.y - y)\n            if (d < bestD) { bestD = d; best = k }\n          }\n          if (best && bestD < 5) {\n            nx = best.x + losowo(-1, 1)\n            ny = best.y + losowo(-1, 1)\n          }\n        }\n        return {\n          ...s,\n          stol: {\n            ...s.stol,\n            items: s.stol.items.map((i) =>\n              i.uid === uid ? { ...i, x: wGranicach(nx), y: wGranicach(ny) } : i\n            ),\n          },\n        }\n      })\n    },\n    [kotwice]\n  )\n\n  const zmienKolor = useCallback((uid, color) => {\n    setStan((s) => ({\n      ...s,\n      stol: { ...s.stol, items: s.stol.items.map((i) => (i.uid === uid ? { ...i, color } : i)) },\n    }))\n  }, [])\n\n  const obroc = useCallback((uid, delta) => {\n    setStan((s) => ({\n      ...s,\n      stol: { ...s.stol, items: s.stol.items.map((i) => (i.uid === uid ? { ...i, rot: i.rot + delta } : i)) },\n    }))\n  }, [])\n\n  const skaluj = useCallback((uid, mnoznik) => {\n    setStan((s) => ({\n      ...s,\n      stol: {\n        ...s.stol,\n        items: s.stol.items.map((i) =>\n          i.uid === uid ? { ...i, skala: Math.min(1.9, Math.max(0.5, i.skala * mnoznik)) } : i\n        ),\n      },\n    }))\n  }, [])\n\n  const usun = useCallback((uid) => {\n    setStan((s) => ({ ...s, stol: { ...s.stol, items: s.stol.items.filter((i) => i.uid !== uid) } }))\n  }, [])\n\n  // Przelozenie elementu przed wszystkie inne / za wszystkie inne\n  const naPrzod = useCallback((uid) => {\n    setStan((s) => {\n      const max = Math.max(...s.stol.items.map((i) => i.z ?? 0), 0)\n      return {\n        ...s,\n        stol: { ...s.stol, items: s.stol.items.map((i) => (i.uid === uid ? { ...i, z: max + 1 } : i)) },\n      }\n    })\n  }, [])\n\n  const doTylu = useCallback((uid) => {\n    setStan((s) => {\n      const min = Math.min(...s.stol.items.map((i) => i.z ?? 0), BAZA_Z.flower)\n      // nie schodzimy ponizej MIN_Z, zeby nic nie schowalo sie za wazonem\n      return {\n        ...s,\n        stol: {\n          ...s.stol,\n          items: s.stol.items.map((i) => (i.uid === uid ? { ...i, z: Math.max(MIN_Z, min - 1) } : i)),\n        },\n      }\n    })\n  }, [])\n\n  const ustawWazon = useCallback((vaseId) => {\n    setStan((s) => ({\n      ...s,\n      stol: { ...s.stol, vaseId, vaseColor: BY_ID.vase[vaseId]?.kolor || VASES[vaseId]?.defaultColor },\n    }))\n  }, [])\n\n  const ustawKolorWazonu = useCallback((vaseColor) => {\n    setStan((s) => ({ ...s, stol: { ...s.stol, vaseColor } }))\n  }, [])\n\n  const wyczyscStol = useCallback(() => {\n    setStan((s) => ({ ...s, stol: { ...s.stol, items: [] } }))\n  }, [])\n\n  // --- Kolekcja i sprzedaz ---\n\n  const wycena = useMemo(() => wycen(stol.items, stol.vaseId), [stol.items, stol.vaseId])\n\n  // UWAGA: wynik liczymy z biezacego stanu PRZED setStan.\n  // Odczyt z wnetrza updatera nie dziala - React uruchamia go pozniej (i w StrictMode dwa razy).\n  const zapiszDoKolekcji = useCallback(\n    (nazwa) => {\n      if (!stol.items.some((i) => i.kind === 'flower')) return false\n      const wpis = {\n        uid: nowyUid(),\n        nazwa: nazwa || `Bukiet ${stan.kolekcja.length + 1}`,\n        data: new Date().toISOString(),\n        vaseId: stol.vaseId,\n        vaseColor: stol.vaseColor,\n        items: stol.items.map((i) => ({ ...i })),\n        wartosc: wycen(stol.items, stol.vaseId).razem,\n      }\n      setStan((s) => ({ ...s, kolekcja: [wpis, ...s.kolekcja], stol: { ...s.stol, items: [] } }))\n      return true\n    },\n    [stol, stan.kolekcja.length]\n  )\n\n  const sprzedaj = useCallback(() => {\n    const w = wycen(stol.items, stol.vaseId)\n    if (!w.mozna) return 0\n    setStan((s) => ({\n      ...s,\n      gwiazdki: s.gwiazdki + w.razem,\n      sprzedanych: s.sprzedanych + 1,\n      stol: { ...s.stol, items: [] },\n    }))\n    return w.razem\n  }, [stol])\n\n  const sprzedajZKolekcji = useCallback(\n    (uid) => {\n      const wpis = stan.kolekcja.find((k) => k.uid === uid)\n      if (!wpis) return 0\n      setStan((s) => ({\n        ...s,\n        gwiazdki: s.gwiazdki + wpis.wartosc,\n        sprzedanych: s.sprzedanych + 1,\n        kolekcja: s.kolekcja.filter((k) => k.uid !== uid),\n      }))\n      return wpis.wartosc\n    },\n    [stan.kolekcja]\n  )\n\n  const wczytajZKolekcji = useCallback((uid) => {\n    setStan((s) => {\n      const wpis = s.kolekcja.find((k) => k.uid === uid)\n      if (!wpis) return s\n      return {\n        ...s,\n        stol: { vaseId: wpis.vaseId, vaseColor: wpis.vaseColor, items: wpis.items.map((i) => ({ ...i, uid: nowyUid() })) },\n      }\n    })\n  }, [])\n\n  const usunZKolekcji = useCallback((uid) => {\n    setStan((s) => ({ ...s, kolekcja: s.kolekcja.filter((k) => k.uid !== uid) }))\n  }, [])\n\n  // --- Sklepik ---\n\n  const kup = useCallback(\n    (kind, id) => {\n      const kat = BY_ID[kind][id]\n      if (!kat || (stan.odblokowane[kind] || []).includes(id)) return false\n      if (stan.gwiazdki < kat.cena) return false\n      setStan((s) => ({\n        ...s,\n        gwiazdki: s.gwiazdki - kat.cena,\n        odblokowane: { ...s.odblokowane, [kind]: [...s.odblokowane[kind], id] },\n      }))\n      return true\n    },\n    [stan.odblokowane, stan.gwiazdki]\n  )\n\n  const reset = useCallback(() => {\n    localStorage.removeItem(KEY)\n    setStan(stanPoczatkowy())\n  }, [])\n\n  // tryb testowy dla dorosłych: dosypanie gwiazdek (widoczne w Ustawieniach)\n  const dosypGwiazdki = useCallback((n) => {\n    setStan((s) => ({ ...s, gwiazdki: s.gwiazdki + n }))\n  }, [])\n\n  return {\n    stan,\n    stol,\n    kotwice,\n    wycena,\n    limitKwiatow,\n    limitLisci,\n    kwiatow,\n    lisci,\n    odblokowany,\n    dodaj,\n    przesun,\n    upusc,\n    zmienKolor,\n    obroc,\n    skaluj,\n    usun,\n    naPrzod,\n    doTylu,\n    ustawWazon,\n    ustawKolorWazonu,\n    wyczyscStol,\n    zapiszDoKolekcji,\n    sprzedaj,\n    sprzedajZKolekcji,\n    wczytajZKolekcji,\n    usunZKolekcji,\n    kup,\n    reset,\n    dosypGwiazdki,\n  }\n}\n", "src/components/ItemArt.jsx": "import React from 'react'\nimport { FlowerArt } from '../art/flowers'\nimport { LeafArt } from '../art/leaves'\nimport { ExtraArt } from '../art/extras'\nimport { VaseThumb } from '../art/vases'\n\n// Jedno miejsce, ktore wie ktory zestaw ksztaltow narysowac\nexport function ItemArt({ kind, id, color, size = '100%' }) {\n  if (kind === 'leaf') return <LeafArt id={id} color={color} size={size} />\n  if (kind === 'extra') return <ExtraArt id={id} color={color} size={size} />\n  if (kind === 'vase') return <VaseThumb id={id} color={color} size={size} />\n  return <FlowerArt id={id} color={color} size={size} />\n}\n", "src/components/Palette.jsx": "import React from 'react'\nimport { COLOR_SETS } from '../data/colors'\n\nexport function Palette({ kind, wybrany, onWybierz, tytul = 'Kolor' }) {\n  const kolory = COLOR_SETS[kind] || COLOR_SETS.flower\n  return (\n    <div className=\"paleta\">\n      <div className=\"paleta-tytul\">{tytul}</div>\n      <div className=\"paleta-siatka\">\n        {kolory.map((k) => (\n          <button\n            key={k}\n            type=\"button\"\n            className={'swatch' + (k === wybrany ? ' wybrany' : '')}\n            style={{ background: k }}\n            aria-label={`Kolor ${k}`}\n            onClick={() => onWybierz(k)}\n          />\n        ))}\n      </div>\n    </div>\n  )\n}\n", "src/components/BouquetPreview.jsx": "import React from 'react'\nimport { VASES, VaseArt } from '../art/vases'\nimport { sciezkiLodyg } from '../art/stems'\nimport { TableArt } from '../art/Table'\nimport { ItemArt } from './ItemArt'\nimport { ROZMIAR_ELEMENTU as ROZMIAR } from '../data/catalog'\n\n\n// Statyczny podglad bukietu - uzywany w kolekcji. Ten sam uklad co stol roboczy.\nexport function BouquetPreview({ vaseId, vaseColor, items }) {\n  const wazon = VASES[vaseId] || VASES.wazon_kula\n  const usta = wazon.mouth\n  const lodygi = sciezkiLodyg(items, usta, wazon.dno)\n  const pudlo = {\n    left: `${wazon.box.x}%`,\n    top: `${wazon.box.y}%`,\n    width: `${wazon.box.size}%`,\n    height: `${wazon.box.size}%`,\n  }\n\n  const rysuj = (item) => (\n    <div\n      key={item.uid}\n      className=\"item statyczny\"\n      style={{\n        left: `${item.x}%`,\n        top: `${item.y}%`,\n        width: `${ROZMIAR[item.kind] || 21}%`,\n        zIndex: item.z,\n        transformOrigin: item.kind === 'leaf' ? '50% 84%' : '50% 50%',\n        transform: `translate(-50%, -50%) rotate(${item.rot}deg) scale(${item.skala})`,\n      }}\n    >\n      <ItemArt kind={item.kind} id={item.id} color={item.color} />\n    </div>\n  )\n\n  return (\n    <div className=\"podglad\">\n      <TableArt />\n      <div className=\"wazon wazon-tyl\" style={pudlo}>\n        <VaseArt id={vaseId} color={vaseColor} size=\"100%\" />\n      </div>\n\n      <svg className=\"lodygi\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n        <ellipse\n          cx={wazon.box.x + wazon.box.size / 2}\n          cy={wazon.box.y + wazon.box.size * 0.925}\n          rx={wazon.box.size * 0.26}\n          ry={2.6}\n          fill=\"#4b2f74\"\n          opacity=\"0.28\"\n        />\n        {lodygi.map((l) => (\n          <path key={l.uid} d={l.d} stroke={l.kolor} strokeWidth=\"1.2\" strokeLinecap=\"round\" fill=\"none\" />\n        ))}\n      </svg>\n\n      <div className=\"wazon wazon-przod\" style={pudlo}>\n        <VaseArt id={vaseId} color={vaseColor} size=\"100%\" tylko=\"przod\" />\n      </div>\n\n      {lodygi.map((l) => (\n          <svg\n            key={`nad-${l.uid}`}\n            className=\"lodyga-nad\"\n            style={{ zIndex: l.z - 1 }}\n            viewBox=\"0 0 100 100\"\n            preserveAspectRatio=\"none\"\n            aria-hidden=\"true\"\n          >\n            <path d={l.dNad} stroke={l.kolor} strokeWidth=\"1.2\" strokeLinecap=\"round\" fill=\"none\" />\n          </svg>\n      ))}\n\n      {items.map(rysuj)}\n    </div>\n  )\n}\n", "src/components/Workbench.jsx": "import React, { useCallback, useEffect, useRef, useState } from 'react'\nimport { TableArt, TrashArt } from '../art/Table'\nimport { VASES, VaseArt } from '../art/vases'\nimport { sciezkiLodyg } from '../art/stems'\nimport { ItemArt } from './ItemArt'\nimport { ROZMIAR_ELEMENTU as ROZMIAR } from '../data/catalog'\nimport { Palette } from './Palette'\nimport { dzwiek } from '../sound'\n\n\nexport function Workbench({ gra, sceneRef, zaznaczony, setZaznaczony }) {\n  const { stol, kotwice, przesun, upusc, usun, zmienKolor, obroc, skaluj, naPrzod, doTylu } = gra\n  const koszRef = useRef(null)\n  const [koszAktywny, setKoszAktywny] = useState(false)\n  const [przeciagany, setPrzeciagany] = useState(null)\n  const drag = useRef(null)\n\n  const doProcentow = useCallback(\n    (clientX, clientY) => {\n      const r = sceneRef.current.getBoundingClientRect()\n      if (!r.width || !r.height) return null\n      return {\n        x: ((clientX - r.left) / r.width) * 100,\n        y: ((clientY - r.top) / r.height) * 100,\n      }\n    },\n    [sceneRef]\n  )\n\n  const nadKoszem = (clientX, clientY) => {\n    const el = koszRef.current\n    if (!el) return false\n    const r = el.getBoundingClientRect()\n    return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom\n  }\n\n  const onPointerDown = (e, item) => {\n    e.stopPropagation()\n    e.currentTarget.setPointerCapture(e.pointerId)\n    const p = doProcentow(e.clientX, e.clientY)\n    if (!p) return\n    drag.current = {\n      uid: item.uid,\n      dx: item.x - p.x,\n      dy: item.y - p.y,\n      startX: e.clientX,\n      startY: e.clientY,\n      ruszony: false,\n    }\n  }\n\n  const onPointerMove = (e) => {\n    const d = drag.current\n    if (!d) return\n    const dist = Math.hypot(e.clientX - d.startX, e.clientY - d.startY)\n    if (!d.ruszony && dist < 6) return\n    d.ruszony = true\n    setPrzeciagany(d.uid)\n    const p = doProcentow(e.clientX, e.clientY)\n    if (!p) return\n    przesun(d.uid, p.x + d.dx, p.y + d.dy)\n    setKoszAktywny(nadKoszem(e.clientX, e.clientY))\n  }\n\n  const onPointerUp = (e, item) => {\n    const d = drag.current\n    drag.current = null\n    setKoszAktywny(false)\n    setPrzeciagany(null)\n    if (!d) return\n    if (!d.ruszony) {\n      // krotkie tapniecie = zaznaczenie i paletka kolorow\n      setZaznaczony((z) => (z === item.uid ? null : item.uid))\n      return\n    }\n    if (nadKoszem(e.clientX, e.clientY)) {\n      usun(d.uid)\n      setZaznaczony(null)\n      dzwiek.kosz()\n      return\n    }\n    const p = doProcentow(e.clientX, e.clientY)\n    if (!p) return\n    upusc(d.uid, p.x + d.dx, p.y + d.dy)\n  }\n\n  // Escape / klik w tlo zamyka paletke\n  useEffect(() => {\n    const onKey = (e) => e.key === 'Escape' && setZaznaczony(null)\n    window.addEventListener('keydown', onKey)\n    return () => window.removeEventListener('keydown', onKey)\n  }, [setZaznaczony])\n\n  const wazon = VASES[stol.vaseId] || VASES.wazon_kula\n  const usta = wazon.mouth\n  const lodygi = sciezkiLodyg(stol.items, usta, wazon.dno)\n  const pudloWazonu = {\n    left: `${wazon.box.x}%`,\n    top: `${wazon.box.y}%`,\n    width: `${wazon.box.size}%`,\n    height: `${wazon.box.size}%`,\n  }\n  const zazn = stol.items.find((i) => i.uid === zaznaczony)\n\n  const renderItem = (item) => {\n    const bazowy = ROZMIAR[item.kind] || 21\n    return (\n      <div\n        key={item.uid}\n        className={\n          'item' +\n          (zaznaczony === item.uid ? ' zaznaczony' : '') +\n          (przeciagany === item.uid ? ' przeciagany' : '')\n        }\n        style={{\n          left: `${item.x}%`,\n          top: `${item.y}%`,\n          width: `${bazowy}%`,\n          zIndex: item.z,\n          // liscie obracaja sie wokol nasady (dolu), a nie srodka - dzieki temu\n          // przy obracaniu nie wyjezdzaja z wazonu i latwiej je dopasowac\n          transformOrigin: item.kind === 'leaf' ? '50% 84%' : '50% 50%',\n          transform: `translate(-50%, -50%) rotate(${item.rot}deg) scale(${item.skala})`,\n        }}\n        onPointerDown={(e) => onPointerDown(e, item)}\n        onPointerMove={onPointerMove}\n        onPointerUp={(e) => onPointerUp(e, item)}\n        onPointerCancel={() => { drag.current = null; setKoszAktywny(false); setPrzeciagany(null) }}\n      >\n        <ItemArt kind={item.kind} id={item.id} color={item.color} />\n      </div>\n    )\n  }\n\n  return (\n    <div className=\"plansza\" onPointerDown={() => setZaznaczony(null)}>\n      <div className=\"scena\" ref={sceneRef}>\n        <TableArt />\n\n        {/* Wazon TYL: caly ksztalt, rysowany pod lodygami */}\n        <div className=\"wazon wazon-tyl\" style={pudloWazonu}>\n          <VaseArt id={stol.vaseId} color={stol.vaseColor} size=\"100%\" />\n        </div>\n\n        {/* Lodygi: jedna uniwersalna krzywa od wnetrza wazonu do glowki kwiatu */}\n        <svg className=\"lodygi\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n          {/* cien styku wazonu z blatem - bez niego wazon sprawia wrazenie, ze lewituje */}\n          <ellipse\n            cx={wazon.box.x + wazon.box.size / 2}\n            cy={wazon.box.y + wazon.box.size * 0.925}\n            rx={wazon.box.size * 0.26}\n            ry={2.6}\n            fill=\"#4b2f74\"\n            opacity=\"0.28\"\n          />\n          {lodygi.map((l) => (\n            <path key={l.uid} d={l.d} stroke={l.kolor} strokeWidth=\"1.2\" strokeLinecap=\"round\" fill=\"none\" />\n          ))}\n        </svg>\n\n        {/* Wazon PRZOD: tylko czesc ponizej linii otworu, rysowana nad lodygami.\n            Efekt: lodygi widac, jak wchodza w otwor, a dalej chowaja sie w wazonie. */}\n        <div className=\"wazon wazon-przod\" style={pudloWazonu}>\n          <VaseArt id={stol.vaseId} color={stol.vaseColor} size=\"100%\" tylko=\"przod\" />\n        </div>\n\n        {/* Kazda lodyga jeszcze raz, w warstwie SWOJEGO kwiatu i przycieta od gory\n            do wylotu wazonu (albo do samego kwiatu, jesli ten wisi nizej).\n            Dzieki temu „do tylu / na wierzch\" przesuwa kwiat RAZEM z lodyga,\n            a mimo to nic nie rysuje sie po korpusie wazonu. */}\n        {lodygi.map((l) => (\n            <svg\n              key={`nad-${l.uid}`}\n              className=\"lodyga-nad\"\n              style={{ zIndex: l.z - 1 }}\n              viewBox=\"0 0 100 100\"\n              preserveAspectRatio=\"none\"\n              aria-hidden=\"true\"\n            >\n              <path d={l.dNad} stroke={l.kolor} strokeWidth=\"1.2\" strokeLinecap=\"round\" fill=\"none\" />\n            </svg>\n        ))}\n\n        {/* Podpowiedz gdy pusto */}\n        {stol.items.length === 0 && (\n          <div className=\"podpowiedz\">\n            <span>Wybierz kwiatek z panelu&nbsp;👇</span>\n            <small>albo przeciągnij go na stół</small>\n          </div>\n        )}\n\n        {/* Kolejnosc warstw bierze sie z pola z kazdego elementu (przyciski „do tylu / na wierzch\") */}\n        {stol.items.map(renderItem)}\n\n        {/* Paletka + narzedzia zaznaczonego elementu */}\n        {zazn && (\n          <div\n            className=\"narzedzia\"\n            style={{\n              left: `${Math.min(78, Math.max(22, zazn.x))}%`,\n              top: `${Math.min(88, Math.max(6, zazn.y + 14))}%`,\n            }}\n            onPointerDown={(e) => e.stopPropagation()}\n          >\n            <Palette\n              kind={zazn.kind}\n              wybrany={zazn.color}\n              tytul=\"Zmień kolor\"\n              onWybierz={(k) => zmienKolor(zazn.uid, k)}\n            />\n            <div className=\"narzedzia-rzad\">\n              <button type=\"button\" onClick={() => obroc(zazn.uid, -5)} title=\"Obróć w lewo\">↺</button>\n              <button type=\"button\" onClick={() => skaluj(zazn.uid, 0.88)} title=\"Mniejszy\">－</button>\n              <button type=\"button\" onClick={() => skaluj(zazn.uid, 1.14)} title=\"Większy\">＋</button>\n              <button type=\"button\" onClick={() => obroc(zazn.uid, 5)} title=\"Obróć w prawo\">↻</button>\n            </div>\n            <div className=\"narzedzia-rzad\">\n              <button type=\"button\" className=\"szeroki\" onClick={() => doTylu(zazn.uid)}>\n                ↙ Do tyłu\n              </button>\n              <button type=\"button\" className=\"szeroki\" onClick={() => naPrzod(zazn.uid)}>\n                Na wierzch ↗\n              </button>\n              <button\n                type=\"button\"\n                className=\"usun\"\n                onClick={() => { usun(zazn.uid); setZaznaczony(null); dzwiek.kosz() }}\n                title=\"Wyrzuć\"\n              >\n                🗑\n              </button>\n            </div>\n          </div>\n        )}\n      </div>\n\n      <div ref={koszRef} className={'kosz' + (koszAktywny ? ' aktywny' : '')} title=\"Przeciągnij tutaj, żeby wyrzucić\">\n        <TrashArt open={koszAktywny} />\n        <span>Kosz</span>\n      </div>\n    </div>\n  )\n}\n", "src/components/Panels.jsx": "import React, { useRef, useState } from 'react'\nimport { CATALOG_LIST, KATEGORIE } from '../data/catalog'\nimport { ItemArt } from './ItemArt'\nimport { Palette } from './Palette'\n\nexport function Panels({ gra, sceneRef, naSklep, onKomunikat }) {\n  const [kat, setKat] = useState('flower')\n  const [otwarty, setOtwarty] = useState(true)\n  const { odblokowany, dodaj, stol, ustawWazon, ustawKolorWazonu } = gra\n  const [duch, setDuch] = useState(null)\n  const drag = useRef(null)\n\n  const lista = CATALOG_LIST[kat]\n\n  const nadScena = (x, y) => {\n    const el = sceneRef.current\n    if (!el) return null\n    const r = el.getBoundingClientRect()\n    // scena jeszcze bez wymiarow (np. tuz po starcie) - lepiej oddac null niz policzyc NaN\n    if (!r.width || !r.height) return null\n    if (x < r.left || x > r.right || y < r.top || y > r.bottom) return null\n    const p = { x: ((x - r.left) / r.width) * 100, y: ((y - r.top) / r.height) * 100 }\n    return Number.isFinite(p.x) && Number.isFinite(p.y) ? p : null\n  }\n\n  const startDrag = (e, poz) => {\n    if (kat === 'vase') return\n    // Na dotyku NIE przechwytujemy wskaznika i nie przeciagamy z polki: gest\n    // w gore (polka jest POD stolem) walczylby z przewijaniem listy kwiatow.\n    // Zostaje tapniecie - kwiat sam wskakuje na wolne miejsce w wazonie.\n    const dotyk = e.pointerType === 'touch'\n    if (!dotyk) e.currentTarget.setPointerCapture(e.pointerId)\n    drag.current = { poz, startX: e.clientX, startY: e.clientY, ruszony: false, dotyk }\n  }\n\n  const moveDrag = (e) => {\n    const d = drag.current\n    if (!d || d.dotyk) return\n    if (!d.ruszony && Math.hypot(e.clientX - d.startX, e.clientY - d.startY) < 8) return\n    d.ruszony = true\n    setDuch({ poz: d.poz, x: e.clientX, y: e.clientY })\n  }\n\n  const endDrag = (e, poz) => {\n    const d = drag.current\n    drag.current = null\n    setDuch(null)\n    if (!d) return\n    // Palec pojechal w bok/w dol = to bylo przewijanie polki, nie tapniecie.\n    // Zwykle zalatwia to pointercancel, ale nie kazda przegladarka go wysyla.\n    if (d.dotyk && Math.hypot(e.clientX - d.startX, e.clientY - d.startY) > 10) return\n    if (!d.ruszony) {\n      // tapniecie = kwiat sam wskakuje na wolny punkt kotwiczacy\n      const blad = dodaj(kat, poz.id, poz.kolor, null)\n      if (blad) onKomunikat(blad)\n      return\n    }\n    const punkt = nadScena(e.clientX, e.clientY)\n    if (punkt) {\n      const blad = dodaj(kat, poz.id, poz.kolor, punkt)\n      if (blad) onKomunikat(blad)\n    }\n  }\n\n  return (\n    <section className={'panele' + (otwarty ? '' : ' zwiniete')}>\n      <div className=\"zakladki\">\n        {KATEGORIE.map((k) => (\n          <button\n            key={k.key}\n            type=\"button\"\n            className={'zakladka' + (kat === k.key ? ' aktywna' : '')}\n            onClick={() => { setKat(k.key); setOtwarty(true) }}\n          >\n            <span className=\"emo\">{k.emoji}</span>\n            <span>{k.label}</span>\n          </button>\n        ))}\n        <button\n          type=\"button\"\n          className=\"zwin\"\n          onClick={() => setOtwarty((o) => !o)}\n          title={otwarty ? 'Zwiń panel' : 'Rozwiń panel'}\n        >\n          {otwarty ? '▾' : '▴'}\n        </button>\n      </div>\n\n      <div className=\"panel-tresc\">\n        {kat === 'vase' && (\n          <div className=\"wazon-kolor\">\n            <Palette\n              kind=\"vase\"\n              tytul=\"Kolor wazonu\"\n              wybrany={stol.vaseColor}\n              onWybierz={(k) => ustawKolorWazonu(k)}\n            />\n          </div>\n        )}\n\n        <div className=\"siatka\">\n          {lista.map((poz) => {\n            const mam = odblokowany(kat, poz.id)\n            const aktywnyWazon = kat === 'vase' && stol.vaseId === poz.id\n            return (\n              <button\n                key={poz.id}\n                type=\"button\"\n                className={'kafel' + (mam ? '' : ' zamkniety') + (aktywnyWazon ? ' wybrany' : '')}\n                onPointerDown={(e) => mam && startDrag(e, poz)}\n                onPointerMove={moveDrag}\n                onPointerUp={(e) => {\n                  if (!mam) { naSklep(); return }\n                  if (kat === 'vase') { ustawWazon(poz.id); return }\n                  endDrag(e, poz)\n                }}\n                onPointerCancel={() => { drag.current = null; setDuch(null) }}\n              >\n                <span className=\"kafel-art\">\n                  <ItemArt kind={kat} id={poz.id} color={poz.kolor} />\n                </span>\n                <span className=\"kafel-nazwa\">{poz.nazwa}</span>\n                {!mam && <span className=\"klodka\">🔒 {poz.cena}★</span>}\n              </button>\n            )\n          })}\n        </div>\n      </div>\n\n      {duch && (\n        <div className=\"duch\" style={{ left: duch.x, top: duch.y }}>\n          <ItemArt kind={kat} id={duch.poz.id} color={duch.poz.kolor} />\n        </div>\n      )}\n    </section>\n  )\n}\n", "src/components/Collection.jsx": "import React from 'react'\nimport { BouquetPreview } from './BouquetPreview'\nimport { dzwiek } from '../sound'\n\nexport function Collection({ gra, naStol }) {\n  const { stan, sprzedajZKolekcji, wczytajZKolekcji, usunZKolekcji } = gra\n  const { kolekcja } = stan\n\n  if (!kolekcja.length) {\n    return (\n      <div className=\"widok pusto\">\n        <div className=\"pusto-ikona\">🖼️</div>\n        <h2>Kolekcja jest jeszcze pusta</h2>\n        <p>Ułóż bukiet na stole i kliknij <strong>Zapisz</strong>, żeby trafił tutaj.</p>\n        <button type=\"button\" className=\"btn duzy\" onClick={naStol}>Wracam do stołu</button>\n      </div>\n    )\n  }\n\n  return (\n    <div className=\"widok\">\n      <h2 className=\"naglowek-widoku\">Moja kolekcja <span className=\"licznik-mini\">{kolekcja.length}</span></h2>\n      <div className=\"galeria\">\n        {kolekcja.map((b) => (\n          <article key={b.uid} className=\"karta-bukietu\">\n            <BouquetPreview vaseId={b.vaseId} vaseColor={b.vaseColor} items={b.items} />\n            <h3>{b.nazwa}</h3>\n            <p className=\"meta\">\n              {new Date(b.data).toLocaleDateString('pl-PL')} · wart {b.wartosc}★\n            </p>\n            <div className=\"karta-akcje\">\n              <button type=\"button\" className=\"btn maly\" onClick={() => { wczytajZKolekcji(b.uid); naStol() }}>\n                Otwórz\n              </button>\n              <button\n                type=\"button\"\n                className=\"btn maly zloty\"\n                onClick={() => { const z = sprzedajZKolekcji(b.uid); if (z) dzwiek.sprzedaz() }}\n              >\n                Sprzedaj {b.wartosc}★\n              </button>\n              <button\n                type=\"button\"\n                className=\"btn maly cichy\"\n                onClick={() => { if (confirm(`Na pewno usunąć „${b.nazwa}”?`)) { usunZKolekcji(b.uid); dzwiek.kosz() } }}\n              >\n                🗑\n              </button>\n            </div>\n          </article>\n        ))}\n      </div>\n    </div>\n  )\n}\n", "src/components/Shop.jsx": "import React, { useState } from 'react'\nimport { CATALOG_LIST, KATEGORIE } from '../data/catalog'\nimport { ItemArt } from './ItemArt'\nimport { dzwiek } from '../sound'\n\nexport function Shop({ gra }) {\n  const { stan, odblokowany, kup } = gra\n  const [kat, setKat] = useState('flower')\n  const [komunikat, setKomunikat] = useState(null)\n\n  const lista = CATALOG_LIST[kat]\n\n  const sprobuj = (poz) => {\n    if (odblokowany(kat, poz.id)) return\n    if (kup(kat, poz.id)) {\n      dzwiek.zakup()\n      setKomunikat(`Odblokowane: ${poz.nazwa} 🎉`)\n    } else {\n      dzwiek.blad()\n      setKomunikat(`Brakuje ${poz.cena - stan.gwiazdki}★ — jeszcze jeden bukiet do sprzedania!`)\n    }\n    setTimeout(() => setKomunikat(null), 2200)\n  }\n\n  return (\n    <div className=\"widok\">\n      <h2 className=\"naglowek-widoku\">\n        Sklepik <span className=\"licznik-mini\">{stan.gwiazdki}★</span>\n      </h2>\n      <p className=\"podtytul\">Sprzedawaj bukiety, zbieraj gwiazdki i odblokowuj nowe rzeczy.</p>\n\n      <div className=\"zakladki sklep-zakladki\">\n        {KATEGORIE.map((k) => (\n          <button\n            key={k.key}\n            type=\"button\"\n            className={'zakladka' + (kat === k.key ? ' aktywna' : '')}\n            onClick={() => setKat(k.key)}\n          >\n            <span className=\"emo\">{k.emoji}</span>\n            <span>{k.label}</span>\n          </button>\n        ))}\n      </div>\n\n      {komunikat && <div className=\"komunikat\">{komunikat}</div>}\n\n      <div className=\"siatka sklep-siatka\">\n        {lista.map((poz) => {\n          const mam = odblokowany(kat, poz.id)\n          const stac = stan.gwiazdki >= poz.cena\n          return (\n            <button\n              key={poz.id}\n              type=\"button\"\n              className={'kafel sklep-kafel' + (mam ? ' kupiony' : stac ? ' dostepny' : ' zadrogi')}\n              onClick={() => sprobuj(poz)}\n              disabled={mam}\n            >\n              <span className=\"kafel-art\">\n                <ItemArt kind={kat} id={poz.id} color={poz.kolor} />\n              </span>\n              <span className=\"kafel-nazwa\">{poz.nazwa}</span>\n              <span className=\"cena\">{mam ? '✓ mam' : `${poz.cena}★`}</span>\n            </button>\n          )\n        })}\n      </div>\n    </div>\n  )\n}\n", "src/components/IconSheet.jsx": "import React, { useState } from 'react'\nimport { CATALOG_LIST, KATEGORIE } from '../data/catalog'\nimport { ItemArt } from './ItemArt'\nimport { Palette } from './Palette'\n\n// Kartoteka ikon - wszystkie narysowane ksztalty w jednym miejscu.\n// Sluzy do przegladania z siostrzenica: co poprawic, co dorysowac.\nexport function IconSheet({ naStol }) {\n  const [kolor, setKolor] = useState(null)\n\n  return (\n    <div className=\"widok\">\n      <h2 className=\"naglowek-widoku\">Kartoteka ikon</h2>\n      <p className=\"podtytul\">\n        Wszystkie kwiaty, liście, wazony i dodatki narysowane w grze. Kliknij kolor,\n        żeby zobaczyć, jak wygląda cały zestaw w jednym odcieniu.\n      </p>\n\n      <div className=\"kartoteka-paleta\">\n        <Palette kind=\"flower\" tytul=\"Przemaluj wszystko\" wybrany={kolor} onWybierz={setKolor} />\n        <button type=\"button\" className=\"btn maly cichy\" onClick={() => setKolor(null)}>\n          Kolory własne\n        </button>\n      </div>\n\n      {KATEGORIE.map((k) => (\n        <section key={k.key} className=\"kartoteka-sekcja\">\n          <h3>{k.emoji} {k.label} <span className=\"licznik-mini\">{CATALOG_LIST[k.key].length}</span></h3>\n          <div className=\"siatka sklep-siatka\">\n            {CATALOG_LIST[k.key].map((poz) => (\n              <div key={poz.id} className=\"kafel sklep-kafel\">\n                <span className=\"kafel-art\">\n                  <ItemArt kind={k.key} id={poz.id} color={kolor || poz.kolor} />\n                </span>\n                <span className=\"kafel-nazwa\">{poz.nazwa}</span>\n                <span className=\"cena id-pliku\">{poz.id}</span>\n              </div>\n            ))}\n          </div>\n        </section>\n      ))}\n\n      <div className=\"modal-akcje\" style={{ marginTop: 18, justifyContent: 'center' }}>\n        <button type=\"button\" className=\"btn\" onClick={naStol}>Wracam do stołu</button>\n      </div>\n    </div>\n  )\n}\n", "src/App.jsx": "import React, { useRef, useState } from 'react'\nimport { useGame } from './state/useGame'\nimport { Workbench } from './components/Workbench'\nimport { Panels } from './components/Panels'\nimport { Collection } from './components/Collection'\nimport { Shop } from './components/Shop'\nimport { IconSheet } from './components/IconSheet'\nimport { dzwiek } from './sound'\n\nfunction Modal({ tytul, onZamknij, children }) {\n  return (\n    <div className=\"modal-tlo\" onClick={onZamknij}>\n      <div className=\"modal\" onClick={(e) => e.stopPropagation()}>\n        <header>\n          <h3>{tytul}</h3>\n          <button type=\"button\" className=\"zamknij\" onClick={onZamknij} aria-label=\"Zamknij\">✕</button>\n        </header>\n        {children}\n      </div>\n    </div>\n  )\n}\n\nexport default function App() {\n  const gra = useGame()\n  const sceneRef = useRef(null)\n  const [widok, setWidok] = useState('stol')\n  const [zaznaczony, setZaznaczony] = useState(null)\n  const [modal, setModal] = useState(null)\n  const [nazwaBukietu, setNazwaBukietu] = useState('')\n  const [dzwiekOn, setDzwiekOn] = useState(true)\n  const [toast, setToast] = useState(null)\n\n  const { stan, wycena } = gra\n\n  const pokazToast = (t) => {\n    setToast(t)\n    setTimeout(() => setToast(null), 2400)\n  }\n\n  const zapisz = () => {\n    if (gra.zapiszDoKolekcji(nazwaBukietu.trim())) {\n      dzwiek.zapis()\n      pokazToast('Bukiet w kolekcji! 🖼️')\n    } else {\n      dzwiek.blad()\n      pokazToast('Najpierw dodaj chociaż jeden kwiatek')\n    }\n    setNazwaBukietu('')\n    setModal(null)\n  }\n\n  const sprzedaj = () => {\n    const zysk = gra.sprzedaj()\n    if (zysk) {\n      dzwiek.sprzedaz()\n      pokazToast(`Sprzedane za ${zysk}★`)\n    } else {\n      dzwiek.blad()\n      pokazToast('Bukiet musi mieć co najmniej 3 kwiaty')\n    }\n    setModal(null)\n  }\n\n  return (\n    <div className=\"app\">\n      <header className=\"gorne-menu\">\n        <button\n          type=\"button\"\n          className=\"logo\"\n          onClick={() => { setWidok('stol') }}\n        >\n          <span className=\"logo-kwiat\">🌷</span>\n          <span className=\"logo-tekst\">Ogród<br />Gwiazdek</span>\n        </button>\n\n        <nav className=\"nawigacja\">\n          <button type=\"button\" className={widok === 'stol' ? 'aktywny' : ''} onClick={() => { setWidok('stol') }}>\n            Stół\n          </button>\n          <button type=\"button\" className={widok === 'kolekcja' ? 'aktywny' : ''} onClick={() => { setWidok('kolekcja') }}>\n            Kolekcja <b>{stan.kolekcja.length}</b>\n          </button>\n          <button type=\"button\" className={widok === 'sklep' ? 'aktywny' : ''} onClick={() => { setWidok('sklep') }}>\n            Sklepik\n          </button>\n        </nav>\n\n        <div className=\"prawy-rog\">\n          <div className=\"gwiazdki\" title=\"Twoje gwiazdki\">\n            <span className=\"gwiazda\">★</span>\n            <span className=\"ile\">{stan.gwiazdki}</span>\n          </div>\n          <button type=\"button\" className=\"ikonka\" onClick={() => setModal('ustawienia')} title=\"Ustawienia\">⚙️</button>\n        </div>\n      </header>\n\n      {widok === 'stol' && (\n        <main className=\"stol-widok\">\n          <Workbench gra={gra} sceneRef={sceneRef} zaznaczony={zaznaczony} setZaznaczony={setZaznaczony} />\n\n          <div className=\"akcje\">\n            <span className=\"miejsca\">\n              <b className={gra.kwiatow >= gra.limitKwiatow ? 'pelno' : ''}>\n                🌸 {gra.kwiatow}/{gra.limitKwiatow}\n              </b>\n              <b className={gra.lisci >= gra.limitLisci ? 'pelno' : ''}>\n                🌿 {gra.lisci}/{gra.limitLisci}\n              </b>\n            </span>\n            <button type=\"button\" className=\"btn zapisz\" onClick={() => setModal('zapisz')} title=\"Zapisz bukiet\">\n              💾<span className=\"etykieta\"> Zapisz</span>\n            </button>\n            <button\n              type=\"button\"\n              className={'btn zloty' + (wycena.mozna ? '' : ' nieaktywny')}\n              onClick={() => setModal('sprzedaj')}\n            >\n              ★ Sprzedaj <b>{wycena.razem}</b>\n            </button>\n          </div>\n\n          <Panels gra={gra} sceneRef={sceneRef} naSklep={() => setWidok('sklep')} onKomunikat={pokazToast} />\n        </main>\n      )}\n\n      {widok === 'kolekcja' && <Collection gra={gra} naStol={() => setWidok('stol')} />}\n      {widok === 'sklep' && <Shop gra={gra} />}\n      {widok === 'ikony' && <IconSheet naStol={() => setWidok('stol')} />}\n\n      {modal === 'zapisz' && (\n        <Modal tytul=\"Zapisz bukiet w kolekcji\" onZamknij={() => setModal(null)}>\n          <p>Jak nazwiemy ten bukiet?</p>\n          <input\n            className=\"pole\"\n            value={nazwaBukietu}\n            placeholder={`Bukiet ${stan.kolekcja.length + 1}`}\n            onChange={(e) => setNazwaBukietu(e.target.value)}\n            onKeyDown={(e) => e.key === 'Enter' && zapisz()}\n            maxLength={30}\n            autoFocus\n          />\n          <div className=\"modal-akcje\">\n            <button type=\"button\" className=\"btn cichy\" onClick={() => setModal(null)}>Anuluj</button>\n            <button type=\"button\" className=\"btn\" onClick={zapisz}>Zapisz</button>\n          </div>\n        </Modal>\n      )}\n\n      {modal === 'sprzedaj' && (\n        <Modal tytul=\"Sprzedaj bukiet\" onZamknij={() => setModal(null)}>\n          <ul className=\"rachunek\">\n            <li><span>Kwiaty ({wycena.liczbaKwiatow})</span><b>{wycena.zaKwiaty}★</b></li>\n            {wycena.powtorki > 0 && (\n              <li className=\"uwaga\">\n                <span>w tym powtórki ({wycena.powtorki}) — po 1★</span>\n                <b>{wycena.powtorki}★</b>\n              </li>\n            )}\n            <li><span>Liście (różne rodzaje)</span><b>{wycena.zaLiscie}★</b></li>\n            <li><span>Dodatki</span><b>{wycena.zaDodatki}★</b></li>\n            <li><span>Premia za różne gatunki ({wycena.gatunki})</span><b>{wycena.zaRoznorodnosc}★</b></li>\n            <li><span>Wazon / opakowanie</span><b>{wycena.zaWazon}★</b></li>\n            <li className=\"suma\"><span>Razem</span><b>{wycena.razem}★</b></li>\n          </ul>\n          {!wycena.mozna && <p className=\"ostrzezenie\">Do sprzedaży potrzeba minimum 3 kwiatów — masz {wycena.liczbaKwiatow}.</p>}\n          {wycena.powtorki > 2 && (\n            <p className=\"wskazowka\">\n              Najwięcej gwiazdek daje bukiet z <strong>różnych</strong> kwiatów — te same liczą się tylko po 1★.\n            </p>\n          )}\n          <div className=\"modal-akcje\">\n            <button type=\"button\" className=\"btn cichy\" onClick={() => setModal(null)}>Jeszcze poprawię</button>\n            <button type=\"button\" className={'btn zloty' + (wycena.mozna ? '' : ' nieaktywny')} onClick={sprzedaj}>\n              Sprzedaj za {wycena.razem}★\n            </button>\n          </div>\n        </Modal>\n      )}\n\n      {modal === 'ustawienia' && (\n        <Modal tytul=\"Ustawienia\" onZamknij={() => setModal(null)}>\n          <label className=\"przelacznik\">\n            <input\n              type=\"checkbox\"\n              checked={dzwiekOn}\n              onChange={(e) => { setDzwiekOn(e.target.checked); dzwiek.ustawWlaczony(e.target.checked) }}\n            />\n            <span>Dźwięki</span>\n          </label>\n          <p className=\"statystyki\">\n            Sprzedanych bukietów: <b>{stan.sprzedanych}</b><br />\n            W kolekcji: <b>{stan.kolekcja.length}</b><br />\n            Gwiazdek: <b>{stan.gwiazdki}</b>\n          </p>\n          <div className=\"modal-akcje kolumna\">\n            <button\n              type=\"button\"\n              className=\"btn cichy\"\n              onClick={() => {\n                if (gra.stol.items.length && confirm('Wyczyścić cały stół?')) {\n                  gra.wyczyscStol()\n                  dzwiek.kosz()\n                  setModal(null)\n                }\n              }}\n            >\n              Wyczyść stół\n            </button>\n            <button type=\"button\" className=\"btn cichy\" onClick={() => { setWidok('ikony'); setModal(null) }}>\n              Zobacz kartotekę ikon\n            </button>\n            <button type=\"button\" className=\"btn cichy\" onClick={() => { gra.dosypGwiazdki(50); dzwiek.zakup(); pokazToast('+50★') }}>\n              +50★ (tryb dla rodzica)\n            </button>\n            <button\n              type=\"button\"\n              className=\"btn niebezpieczny\"\n              onClick={() => {\n                if (confirm('Skasować WSZYSTKO: gwiazdki, kolekcję i odblokowane kwiaty?')) {\n                  gra.reset()\n                  setModal(null)\n                  pokazToast('Gra zaczyna się od nowa')\n                }\n              }}\n            >\n              Zacznij grę od nowa\n            </button>\n          </div>\n        </Modal>\n      )}\n\n      {toast && <div className=\"toast\">{toast}</div>}\n    </div>\n  )\n}\n"}
</script>

<script>
// Wszystkie moduly siedza w tym pliku - zero pobierania z dysku, wiec dziala z file://
var ZRODLA = JSON.parse(document.getElementById('zrodla').textContent)
var KOLEJNOSC = ["src/data/colors.js", "src/data/catalog.js", "src/sound.js", "src/art/flowers.jsx", "src/art/leaves.jsx", "src/art/extras.jsx", "src/art/vases.jsx", "src/art/Table.jsx", "src/art/stems.js", "src/state/useGame.js", "src/components/ItemArt.jsx", "src/components/Palette.jsx", "src/components/BouquetPreview.jsx", "src/components/Workbench.jsx", "src/components/Panels.jsx", "src/components/Collection.jsx", "src/components/Shop.jsx", "src/components/IconSheet.jsx", "src/App.jsx"]
var mods = {}

function nazwa(sciezka) {
  return sciezka.split('/').pop().replace(/\.(jsx|js)$/, '')
}

function req(spec) {
  if (spec === 'react') return React
  if (spec === 'react-dom/client') return ReactDOM
  if (spec.slice(-4) === '.css') return {}
  var key = nazwa(spec)
  if (!(key in mods)) throw new Error('brak modulu: ' + spec)
  return mods[key]
}

try {
  if (typeof React === 'undefined' || typeof Babel === 'undefined') {
    throw new Error('Nie udalo sie pobrac React/Babel z internetu. Sprawdz polaczenie i odswiez strone.')
  }
  for (var i = 0; i < KOLEJNOSC.length; i++) {
    var sciezka = KOLEJNOSC[i]
    var kod = Babel.transform(ZRODLA[sciezka], {
      presets: ['react'],
      plugins: ['transform-modules-commonjs'],
      filename: sciezka,
    }).code
    var module = { exports: {} }
    new Function('require', 'module', 'exports', 'React', kod)(req, module, module.exports, React)
    mods[nazwa(sciezka)] = module.exports
  }
  document.getElementById('root').innerHTML = ''
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(React.StrictMode, null, React.createElement(mods.App.default))
  )
} catch (e) {
  document.getElementById('ladowanie').remove()
  document.getElementById('err').textContent = 'BLAD: ' + e.message + '\n\n' + (e.stack || '')
}
</script>
</body></html>
