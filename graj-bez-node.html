<!doctype html>
<!--
  Ogrod Gwiazdek - wersja bez instalowania Node/npm.
  WYGENEROWANY PLIK - nie edytuj recznie.
  Zrodla siedza w src/; po zmianach przebuduj:
      python3 scripts/zbuduj-graj-bez-node.py

  Otwiera sie zwyklym dwuklikiem. Z internetu pobiera tylko React, Babel i font.
-->
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7e9d8">
<title>Ogrod Gwiazdek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --tlo: #fdf3e7;
  --tlo-2: #f7e6d3;
  --karta: #fffdf9;
  --tekst: #4a3b46;
  --tekst-jasny: #8a7580;
  --rozowy: #ef476f;
  --rozowy-jasny: #ffd7e2;
  --zloty: #f4b942;
  --zloty-ciemny: #d99a1f;
  --zielony: #57cc99;
  --cien: 0 4px 14px rgba(122, 74, 46, 0.14);
  --cien-mocny: 0 12px 34px rgba(122, 74, 46, 0.24);
  --r: 18px;
}

* { box-sizing: border-box; }

html, body, #root { height: 100%; }

body {
  margin: 0;
  font-family: 'Baloo 2', 'Trebuchet MS', system-ui, -apple-system, sans-serif;
  color: var(--tekst);
  background: radial-gradient(circle at 20% 0%, #fff7ec 0%, var(--tlo) 45%, var(--tlo-2) 100%);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

button { font-family: inherit; color: inherit; cursor: pointer; }

.app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

/* ---------- Górne menu ---------- */

.gorne-menu {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--karta);
  box-shadow: var(--cien);
  position: sticky;
  top: 0;
  z-index: 50;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  padding: 0;
  font-weight: 700;
  font-size: 15px;
  line-height: 1.05;
  color: var(--rozowy);
  text-align: left;
}
.logo-kwiat { font-size: 28px; }

.nawigacja {
  display: flex;
  gap: 6px;
  margin-left: auto;
}
.nawigacja button {
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 15px;
  font-weight: 600;
  color: var(--tekst-jasny);
}
.nawigacja button.aktywny {
  background: var(--rozowy-jasny);
  color: var(--rozowy);
}
.nawigacja b { font-weight: 700; opacity: 0.7; }

.prawy-rog { display: flex; align-items: center; gap: 8px; }

.gwiazdki {
  display: flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(140deg, #ffe08a, var(--zloty));
  color: #5c3d00;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 999px;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
  min-width: 68px;
  justify-content: center;
}
.gwiazdki .gwiazda { font-size: 17px; }
.gwiazdki .ile { font-size: 17px; }

.ikonka {
  border: 0;
  background: var(--tlo-2);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 18px;
}

/* ---------- Widok stołu ---------- */

.stol-widok {
  flex: 1;
  display: grid;
  gap: 14px;
  padding: 14px;
  grid-template-columns: minmax(0, 1fr) 370px;
  grid-template-rows: 1fr auto;
  grid-template-areas: 'plansza panele' 'akcje panele';
  align-items: start;
}

.plansza {
  grid-area: plansza;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-right: 96px;
}

.scena {
  position: relative;
  width: min(100%, 68vh);
  aspect-ratio: 1 / 1;
  touch-action: none;
  user-select: none;
  /* wlasny kontekst nakladania - warstwy elementow (do ~3000) zostaja WEWNATRZ sceny
     i nie przebijaja gornego paska ani modali */
  isolation: isolate;
}

.table-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

.lodygi { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

.wazon { position: absolute; pointer-events: none; }
/* Wazon w dwoch warstwach. Kolejnosc calej sceny:
   blat 1 | wazon-tyl 5 | lodygi kwiatow 10 | LISCIE ~1000 | wazon-przod 1500 |
   kwiaty ~2000 | dodatki ~3000
   Przod wazonu jest NAD liscmi, zeby ich wlasne lodygi chowaly sie w wazonie
   tak samo jak lodygi kwiatow. */
.wazon-tyl { z-index: 5; }
.wazon-przod { z-index: 1500; }
.wazon svg { width: 100%; height: 100%; display: block; }

.item {
  position: absolute;
  touch-action: none;
  cursor: grab;
  transform-origin: 50% 50%;
  filter: drop-shadow(0 3px 4px rgba(90, 61, 82, 0.22));
}
.item:active { cursor: grabbing; }
/* przeciagany element jest chwilowo na wierzchu, ale jego zapisana warstwa sie nie zmienia */
.item.przeciagany { z-index: 9000 !important; }
.item svg { display: block; width: 100%; height: auto; pointer-events: none; }
.item.zaznaczony { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 7px var(--rozowy)); }
.item.statyczny { cursor: default; }

.podpowiedz {
  position: absolute;
  z-index: 1600;
  left: 50%;
  top: 30%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #a1795c;
  font-weight: 600;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.podpowiedz small { font-weight: 500; opacity: 0.75; }

.kosz {
  position: absolute;
  right: 4px;
  bottom: 8px;
  width: 84px;
  height: 96px;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--tekst-jasny);
  transition: transform 0.15s ease;
  pointer-events: none;
}
.kosz svg { width: 68px; height: 68px; }
.kosz.aktywny { transform: scale(1.18); color: var(--rozowy); }

/* narzędzia zaznaczonego elementu */
.narzedzia {
  position: absolute;
  transform: translate(-50%, 0);
  z-index: 9500;
  background: var(--karta);
  border-radius: var(--r);
  box-shadow: var(--cien-mocny);
  padding: 10px;
  width: 268px;
}
.narzedzia-rzad {
  display: flex;
  gap: 5px;
  margin-top: 6px;
}
.narzedzia-rzad button {
  flex: 1;
  border: 0;
  background: var(--tlo-2);
  border-radius: 11px;
  height: 38px;
  font-size: 16px;
  font-weight: 700;
}
.narzedzia-rzad button.usun { background: #ffdede; flex: 0 0 42px; }
.narzedzia-rzad button.szeroki { font-size: 11.5px; font-weight: 700; white-space: nowrap; padding: 0 4px; }

/* paleta */
.paleta-tytul { font-size: 13px; font-weight: 600; color: var(--tekst-jasny); margin-bottom: 6px; }
.paleta-siatka {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 5px;
}
.swatch {
  border: 2px solid rgba(0, 0, 0, 0.08);
  border-radius: 8px;
  aspect-ratio: 1;
  padding: 0;
  min-width: 24px;
}
.swatch.wybrany { border-color: var(--tekst); transform: scale(1.14); }

/* ---------- Akcje ---------- */

.akcje {
  grid-area: akcje;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  padding-right: 96px;
}

.btn {
  border: 0;
  border-radius: 999px;
  padding: 12px 22px;
  font-size: 16px;
  font-weight: 700;
  background: var(--rozowy);
  color: #fff;
  box-shadow: 0 4px 0 #c9385c;
  min-height: 46px;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c9385c; }
.btn.zloty { background: linear-gradient(140deg, #ffd166, var(--zloty)); color: #5c3d00; box-shadow: 0 4px 0 var(--zloty-ciemny); }
.btn.zloty:active { box-shadow: 0 2px 0 var(--zloty-ciemny); }
.btn.cichy { background: var(--tlo-2); color: var(--tekst-jasny); box-shadow: 0 4px 0 #e0cdb8; }
.btn.niebezpieczny { background: #ffdede; color: #b3243f; box-shadow: 0 4px 0 #f0b9b9; }
.btn.maly { padding: 8px 14px; font-size: 14px; min-height: 38px; }
.btn.duzy { padding: 14px 30px; font-size: 18px; }
.btn.nieaktywny { opacity: 0.5; }

/* ---------- Panele wyboru ---------- */

.panele {
  grid-area: panele;
  background: var(--karta);
  border-radius: var(--r);
  box-shadow: var(--cien);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-height: calc(100vh - 92px);
  position: sticky;
  top: 78px;
}

.zakladki {
  display: flex;
  gap: 4px;
  padding: 8px;
  background: var(--tlo-2);
  align-items: center;
}
.zakladka {
  flex: 1;
  border: 0;
  background: transparent;
  border-radius: 12px;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  font-size: 12px;
  font-weight: 600;
  color: var(--tekst-jasny);
  min-height: 52px;
}
.zakladka .emo { font-size: 19px; }
.zakladka.aktywna { background: var(--karta); color: var(--rozowy); box-shadow: var(--cien); }
.zwin {
  border: 0;
  background: transparent;
  font-size: 15px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: var(--tekst-jasny);
  display: none;
}

.panel-tresc { overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
.wazon-kolor { margin-bottom: 12px; }

.siatka {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
  gap: 8px;
}

.kafel {
  border: 2px solid transparent;
  background: var(--tlo);
  border-radius: 14px;
  padding: 8px 4px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  position: relative;
  min-height: 96px;
  touch-action: none;
}
.kafel-art { width: 56px; height: 56px; display: block; }

/* Dotyk: pionowy gest nalezy do przegladarki (przewijanie polki), nie do kafla.
   Przegladarka przerywa wtedy wskaznik przez pointercancel - Panels.jsx to obsluguje. */
@media (pointer: coarse) {
  .kafel { touch-action: pan-y; }
}
.kafel-art svg { width: 100%; height: 100%; }
.kafel-nazwa { font-size: 11.5px; font-weight: 600; line-height: 1.1; text-align: center; }
.kafel.wybrany { border-color: var(--rozowy); background: var(--rozowy-jasny); }
.kafel.zamkniety .kafel-art { filter: grayscale(1) opacity(0.35); }
.kafel.zamkniety .kafel-nazwa { opacity: 0.5; }
.klodka {
  position: absolute;
  top: 3px;
  right: 3px;
  font-size: 10px;
  font-weight: 700;
  color: var(--zloty-ciemny);
  background: #fff5d9;
  border-radius: 8px;
  padding: 2px 5px;
  line-height: 1.3;
}

.duch {
  position: fixed;
  width: 92px;
  height: 92px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 200;
  opacity: 0.9;
  filter: drop-shadow(0 6px 10px rgba(90, 61, 82, 0.35));
}
.duch svg { width: 100%; height: 100%; }

/* ---------- Kolekcja / Sklepik ---------- */

.widok { padding: 18px; max-width: 1100px; margin: 0 auto; width: 100%; }
.naglowek-widoku { margin: 4px 0 6px; font-size: 24px; display: flex; align-items: center; gap: 10px; }
.licznik-mini {
  font-size: 15px;
  background: var(--rozowy-jasny);
  color: var(--rozowy);
  padding: 3px 12px;
  border-radius: 999px;
}
.podtytul { margin: 0 0 14px; color: var(--tekst-jasny); }

.galeria {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}
.karta-bukietu {
  background: var(--karta);
  border-radius: var(--r);
  box-shadow: var(--cien);
  padding: 12px;
  text-align: center;
}
.karta-bukietu h3 { margin: 8px 0 2px; font-size: 16px; }
.karta-bukietu .meta { margin: 0 0 10px; font-size: 12px; color: var(--tekst-jasny); }
.karta-akcje { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

.podglad {
  position: relative;
  isolation: isolate;
  aspect-ratio: 1;
  background: radial-gradient(circle at 50% 40%, #fff6ea, #f7e2cd);
  border-radius: 14px;
  overflow: hidden;
}

.sklep-zakladki { border-radius: var(--r); margin-bottom: 14px; }
.sklep-siatka { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
.sklep-kafel { min-height: 132px; background: var(--karta); box-shadow: var(--cien); }
.sklep-kafel .cena { font-size: 13px; font-weight: 700; color: var(--zloty-ciemny); }
.sklep-kafel.kupiony { opacity: 0.65; }
.sklep-kafel.kupiony .cena { color: var(--zielony); }
.sklep-kafel.zadrogi .kafel-art { filter: grayscale(0.7) opacity(0.5); }
.sklep-kafel.dostepny { border-color: var(--zloty); }

.komunikat {
  background: #fff5d9;
  color: var(--zloty-ciemny);
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: 600;
  margin-bottom: 12px;
}

.pusto { text-align: center; padding-top: 8vh; }
.pusto-ikona { font-size: 54px; }

/* ---------- Modale ---------- */

.modal-tlo {
  position: fixed;
  inset: 0;
  background: rgba(74, 59, 70, 0.42);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 300;
}
.modal {
  background: var(--karta);
  border-radius: 22px;
  box-shadow: var(--cien-mocny);
  padding: 18px;
  width: min(420px, 100%);
  max-height: 90vh;
  overflow: auto;
}
.modal header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.modal h3 { margin: 0; font-size: 20px; }
.zamknij { border: 0; background: var(--tlo-2); border-radius: 50%; width: 34px; height: 34px; font-size: 15px; }

.pole {
  width: 100%;
  border: 2px solid var(--tlo-2);
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  font-family: inherit;
  margin-bottom: 12px;
}
.pole:focus { outline: none; border-color: var(--rozowy); }

.modal-akcje { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal-akcje.kolumna { flex-direction: column; }

.rachunek { list-style: none; margin: 0 0 12px; padding: 0; }
.rachunek li { display: flex; justify-content: space-between; padding: 7px 2px; border-bottom: 1px dashed var(--tlo-2); }
.rachunek li.suma { border: 0; font-size: 19px; color: var(--zloty-ciemny); padding-top: 12px; }
.ostrzezenie { color: #b3243f; font-weight: 600; }

.przelacznik { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 10px; }
.przelacznik input { width: 22px; height: 22px; accent-color: var(--rozowy); }
.statystyki { color: var(--tekst-jasny); line-height: 1.7; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: var(--tekst);
  color: #fff;
  padding: 12px 22px;
  border-radius: 999px;
  font-weight: 600;
  box-shadow: var(--cien-mocny);
  z-index: 400;
  animation: wjazd 0.25s ease;
}
@keyframes wjazd { from { opacity: 0; transform: translate(-50%, 12px); } }

/* ---------- Telefon ---------- */

@media (max-width: 900px) {
  .stol-widok {
    grid-template-columns: 1fr;
    /* minmax(0, 1fr), nie 1fr: samo 1fr znaczy minmax(auto, 1fr), czyli rzad
       rosnie do wysokosci zawartosci i polka nigdy nie zaczyna sie przewijac */
    grid-template-rows: auto minmax(0, 1fr);
    /* Akcje nie maja wlasnego rzedu - leza W martwym polu nad bukietem (rogi
       sceny sa zawsze puste, bo bukiet jest kopula na srodku). Stol nie musi
       przez nie schodzic nizej. */
    position: relative;
    grid-template-areas: 'plansza' 'panele';
    padding: 10px;
    gap: 8px;
    /* bazowo align-items: start - element dopasowalby sie do zawartosci
       i wylazl poza swoj rzad zamiast oddac miejsce na przewijanie */
    align-items: stretch;
  }
  .plansza { padding-right: 0; padding-bottom: 0; }
  .akcje {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    z-index: 20;
    padding-right: 0;
    flex-wrap: nowrap;
    gap: 8px;
    align-items: flex-start;
    justify-content: space-between;
    /* pasek przykrywa scene, ale klikalne sa tylko same przyciski - reszta
       gestow (przeciaganie kwiatow) leci do sceny pod spodem */
    pointer-events: none;
  }
  .akcje > * { pointer-events: auto; }
  /* Licznik i Zapisz trzymaja sie lewego rogu, Sprzedaj prawego - srodek
     zostaje wolny, bo tam siega kopula pelnego bukietu. */
  .akcje .btn.zapisz { order: 1; }
  .akcje .miejsca { order: 2; margin-right: auto; }
  .akcje .btn.zloty { order: 3; }
  /* Zapisz sama ikona - Sprzedaj zostaje z napisem i liczba gwiazdek,
     bo to nagroda i musi byc czytelna */
  .akcje .btn.zapisz { padding: 8px 12px; }
  .akcje .btn.zapisz .etykieta { display: none; }
  .akcje .btn {
    padding: 8px 14px;
    font-size: 14.5px;
    min-height: 38px;
    box-shadow: 0 3px 0 #c9385c;
    white-space: nowrap;
  }
  .akcje .btn.zloty { box-shadow: 0 3px 0 var(--zloty-ciemny); }
  /* .akcje .miejsca - bazowa regula .miejsca stoi nizej w pliku, wiec sama
     klasa by nie wygrala; potrzebna wyzsza specyficznosc, nie !important */
  .akcje .miejsca {
    font-size: 12.5px;
    opacity: 0.55;
    background: none;
    box-shadow: none;
    padding: 0;
    gap: 6px;
    min-height: 0;
    flex: 0 1 auto;
  }
  .scena { width: min(100%, 56vh); }
  .kosz { right: 0; bottom: 0; width: 62px; height: 74px; }
  .kosz svg { width: 50px; height: 50px; }
  /* Aplikacja mieszcza sie doklodnie w ekranie - strona jako calosc sie NIE
     przewija. Przewija sie tylko polka w srodku. Inaczej gest przewijania
     walczylby z .scena (touch-action: none), ktora zajmuje pol ekranu.
     dvh, nie vh: 100vh na iOS liczy takze pasek przegladarki i jest za wysokie. */
  html, body, #root { height: 100dvh; }
  .app { height: 100dvh; overflow: hidden; }
  .stol-widok { min-height: 0; }
  .panele { position: static; max-height: none; min-height: 0; }
  /* min-height: 0 - bez tego element w gridzie/flexie nie zejdzie ponizej
     wysokosci swojej zawartosci i overflow-y nigdy sie nie wlaczy */
  .panel-tresc { max-height: none; flex: 1 1 auto; min-height: 0; }
  .zwin { display: block; }
  .panele.zwiniete .panel-tresc { display: none; }
  .gorne-menu { padding: 8px 8px; gap: 6px; flex-wrap: nowrap; }
  .logo-tekst { display: none; }
  .logo-kwiat { font-size: 23px; }
  .nawigacja { gap: 2px; }
  .nawigacja button { padding: 8px 9px; font-size: 13.5px; white-space: nowrap; }
  .gwiazdki { min-width: 0; padding: 6px 10px; gap: 4px; }
  .gwiazdki .gwiazda, .gwiazdki .ile { font-size: 15px; }
  .ikonka { width: 34px; height: 34px; font-size: 16px; flex: 0 0 auto; }
  .prawy-rog { gap: 5px; }
  .narzedzia { width: 252px; }
  .kafel { min-height: 92px; }
  .kafel-art { width: 50px; height: 50px; }
}

@media (max-width: 420px) {
  .siatka { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
  .btn { padding: 11px 16px; font-size: 15px; }
}

/* ---------- Kartoteka ikon ---------- */

.kartoteka-paleta {
  background: var(--karta);
  border-radius: var(--r);
  box-shadow: var(--cien);
  padding: 12px;
  margin-bottom: 16px;
  display: flex;
  align-items: flex-end;
  gap: 14px;
  flex-wrap: wrap;
}
.kartoteka-paleta .paleta { flex: 0 1 340px; min-width: 220px; max-width: 340px; }
.kartoteka-sekcja { margin-bottom: 22px; }
.kartoteka-sekcja h3 { display: flex; align-items: center; gap: 8px; font-size: 18px; margin: 0 0 10px; }
.id-pliku { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--tekst-jasny); }

/* licznik zajetych miejsc w wazonie */
.miejsca {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--karta);
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 15px;
  font-weight: 700;
  color: var(--tekst-jasny);
  box-shadow: var(--cien);
  min-height: 46px;
}
.miejsca b { font-weight: 700; white-space: nowrap; }
.miejsca b.pelno { color: var(--rozowy); }

.rachunek li.uwaga { font-size: 13px; color: var(--tekst-jasny); padding-top: 0; }
.rachunek li.uwaga b { font-weight: 600; }
.wskazowka {
  background: #fff5d9;
  color: var(--zloty-ciemny);
  border-radius: 12px;
  padding: 9px 12px;
  font-size: 13.5px;
  margin: 0 0 12px;
}

/* Kopia lodygi w warstwie jej wlasnego kwiatu - przycieta od gory,
   zeby nie rysowala sie po korpusie wazonu. */
.lodyga-nad {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

<script id="zrodla" type="application/json">
{"src/data/colors.js": "// Pomocniki koloru: z jednego koloru bazowego wyliczamy cala palete odcieni,\n// dzieki czemu kazdy kwiat da sie przemalowac jednym klikiem.\n\nfunction hexToRgb(hex) {\n  const h = hex.replace('#', '')\n  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16)\n  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }\n}\n\nfunction rgbToHsl({ r, g, b }) {\n  r /= 255; g /= 255; b /= 255\n  const max = Math.max(r, g, b), min = Math.min(r, g, b)\n  let h = 0, s = 0\n  const l = (max + min) / 2\n  const d = max - min\n  if (d !== 0) {\n    s = l > 0.5 ? d / (2 - max - min) : d / (max + min)\n    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6\n    else if (max === g) h = ((b - r) / d + 2) / 6\n    else h = ((r - g) / d + 4) / 6\n  }\n  return { h: h * 360, s: s * 100, l: l * 100 }\n}\n\nconst clamp = (v, a, b) => Math.min(b, Math.max(a, v))\n\nexport function shade(hex, dl, ds = 0, dh = 0) {\n  const { h, s, l } = rgbToHsl(hexToRgb(hex))\n  return `hsl(${(h + dh + 360) % 360} ${clamp(s + ds, 0, 100)}% ${clamp(l + dl, 0, 100)}%)`\n}\n\n// Paleta odcieni jednego kwiatu.\n// Dla bardzo jasnych kolorow (biel, krem) przyciemniamy mocniej, zeby ksztalt byl czytelny.\nexport function palette(hex) {\n  const { l } = rgbToHsl(hexToRgb(hex))\n  const light = l > 82\n  return {\n    base: hex,\n    light: shade(hex, light ? -5 : 11, -4),\n    dark: shade(hex, light ? -19 : -12, 2),\n    deep: shade(hex, light ? -33 : -24, 4),\n    line: shade(hex, light ? -44 : -30, 6),\n  }\n}\n\n// Palety do wyboru w grze\nexport const FLOWER_COLORS = [\n  '#ef476f', '#ff7aa2', '#ffb3c6', '#fff1f4',\n  '#f4a261', '#ffd166', '#fff3b0', '#ffffff',\n  '#8ac926', '#57cc99', '#4cc9f0', '#4361ee',\n  '#9d4edd', '#c77dff', '#e0aaff', '#a4133c',\n]\n\nexport const VASE_COLORS = [\n  '#e8d5c4', '#d9b8a0', '#c98b6b', '#8d5a44',\n  '#a8dadc', '#457b9d', '#1d3557', '#b7e4c7',\n  '#f7b2bd', '#e5989b', '#ffd6a5', '#fdfcdc',\n  '#cdb4db', '#9a8c98', '#f1faee', '#2f3e46',\n]\n\nexport const LEAF_COLORS = [\n  '#2d6a4f', '#40916c', '#52b788', '#95d5b2',\n  '#7f9172', '#a3b18a', '#588157', '#344e41',\n]\n\nexport const EXTRA_COLORS = [\n  '#e63946', '#ff7aa2', '#ffd166', '#f4a261',\n  '#4cc9f0', '#4361ee', '#9d4edd', '#ffffff',\n  '#2d6a4f', '#8d5a44', '#f1faee', '#2f3e46',\n]\n\nexport const COLOR_SETS = {\n  flower: FLOWER_COLORS,\n  leaf: LEAF_COLORS,\n  vase: VASE_COLORS,\n  extra: EXTRA_COLORS,\n}\n", "src/data/catalog.js": "// Katalog wszystkich elementow gry: nazwy, ceny w sklepiku, wartosc przy sprzedazy,\n// kolor domyslny i to, czy element jest odblokowany od startu.\n//\n// wartosc  = ile gwiazdek dokłada do bukietu przy sprzedaży\n// cena     = ile gwiazdek kosztuje odblokowanie w sklepiku\n// skala    = wielkosc glowki wzgledem bazowej (kwiaty pionowe/kolosowe sa wieksze)\n\nexport const FLOWERS = [\n  { id: 'roza',        nazwa: 'Róża',            kolor: '#ef476f', wartosc: 2, cena: 0,  skala: 1.05, start: true },\n  { id: 'stokrotka',   nazwa: 'Stokrotka',       kolor: '#fff1f4', wartosc: 1, cena: 0,  skala: 0.95, start: true },\n  { id: 'tulipan',     nazwa: 'Tulipan',         kolor: '#ff7aa2', wartosc: 1, cena: 0,  skala: 1.0,  start: true, nasada: { x: 50, y: 75 } },\n  { id: 'rumianek',    nazwa: 'Rumianek',        kolor: '#ffffff', wartosc: 1, cena: 0,  skala: 0.9,  start: true },\n  { id: 'gipsowka',    nazwa: 'Gipsówka',        kolor: '#fff1f4', wartosc: 1, cena: 30, skala: 1.0, nasada: { x: 50, y: 72 } },\n  { id: 'bellis',      nazwa: 'Bellis',          kolor: '#ffb3c6', wartosc: 1, cena: 45, skala: 0.85 },\n  { id: 'viola',       nazwa: 'Bratek',          kolor: '#c77dff', wartosc: 2, cena: 65, skala: 0.9, nasada: { x: 50, y: 80 } },\n  { id: 'narcyz',      nazwa: 'Narcyz',          kolor: '#ffd166', wartosc: 2, cena: 90, skala: 1.0 },\n  { id: 'kosmos',      nazwa: 'Kosmos',          kolor: '#ff7aa2', wartosc: 2, cena: 115, skala: 1.0 },\n  { id: 'cynia',       nazwa: 'Cynia',           kolor: '#f4a261', wartosc: 2, cena: 145, skala: 1.05 },\n  { id: 'szafirek',    nazwa: 'Szafirek',        kolor: '#4361ee', wartosc: 2, cena: 175, skala: 1.0, nasada: { x: 50, y: 92 } },\n  { id: 'hortensja',   nazwa: 'Hortensja',       kolor: '#c77dff', wartosc: 3, cena: 285, skala: 1.15 },\n  { id: 'werbena',     nazwa: 'Werbena',         kolor: '#a4133c', wartosc: 2, cena: 210, skala: 1.0 },\n  { id: 'iberis',      nazwa: 'Iberis',          kolor: '#fdf0f5', wartosc: 2, cena: 245, skala: 1.0, nasada: { x: 50, y: 74 } },\n  { id: 'jasmin',      nazwa: 'Jaśmin',          kolor: '#fff1f4', wartosc: 2, cena: 415, skala: 1.05, nasada: { x: 50, y: 80 } },\n  { id: 'frezja',      nazwa: 'Frezja',          kolor: '#ffd166', wartosc: 3, cena: 465, skala: 1.1, nasada: { x: 25, y: 82 } },\n  { id: 'lupinus',     nazwa: 'Łubin',           kolor: '#9d4edd', wartosc: 3, cena: 515, skala: 1.15, nasada: { x: 50, y: 92 } },\n  { id: 'antirrhinum', nazwa: 'Lwia paszcza',    kolor: '#f4a261', wartosc: 3, cena: 570, skala: 1.15, nasada: { x: 50, y: 88 } },\n  { id: 'brachycome',  nazwa: 'Brachycome',      kolor: '#4cc9f0', wartosc: 2, cena: 325, skala: 0.9 },\n  { id: 'godecja',     nazwa: 'Godecja',         kolor: '#ffb3c6', wartosc: 2, cena: 370, skala: 1.0 },\n  { id: 'polygonum',   nazwa: 'Rdest',           kolor: '#ffb3c6', wartosc: 3, cena: 630, skala: 1.1, nasada: { x: 49, y: 92 } },\n  { id: 'nicotiana',   nazwa: 'Tytoń ozdobny',   kolor: '#8ac926', wartosc: 3, cena: 700, skala: 1.0 },\n  { id: 'piwonia',     nazwa: 'Piwonia królewska', kolor: '#e5397a', wartosc: 6, cena: 1200, skala: 1.3 },\n]\n\nexport const LEAVES = [\n  { id: 'listek',        nazwa: 'Listek',          kolor: '#52b788', wartosc: 1, cena: 0,  skala: 1.0,  start: true },\n  { id: 'eukaliptus',    nazwa: 'Eukaliptus',      kolor: '#95d5b2', wartosc: 1, cena: 0,  skala: 1.15, start: true },\n  { id: 'zdzbla',        nazwa: 'Długa trawa',     kolor: '#8fbf7a', wartosc: 1, cena: 0,  skala: 1.3,  start: true },\n  { id: 'paproc',     nazwa: 'Paproć',     kolor: '#2d6a4f', wartosc: 1, cena: 50, skala: 1.2 },\n  { id: 'ruskus',     nazwa: 'Ruskus',     kolor: '#40916c', wartosc: 1, cena: 80, skala: 1.15 },\n  { id: 'bluszcz',    nazwa: 'Bluszcz',    kolor: '#52b788', wartosc: 1, cena: 120, skala: 1.15 },\n  { id: 'trawa',      nazwa: 'Trawa ozdobna', kolor: '#a3b18a', wartosc: 1, cena: 170, skala: 1.2 },\n]\n\nexport const VASES_CATALOG = [\n  { id: 'wazon_kula',   nazwa: 'Okrągły wazon',    kolor: '#a8dadc', bonus: 0, cena: 0,  start: true },\n  { id: 'doniczka',     nazwa: 'Doniczka',         kolor: '#c98b6b', bonus: 1, cena: 70 },\n  { id: 'wazon_smukly', nazwa: 'Smukły wazon',     kolor: '#457b9d', bonus: 1, cena: 120 },\n  { id: 'sloik',        nazwa: 'Słoik ze wstążką', kolor: '#b7e4c7', bonus: 2, cena: 180 },\n  { id: 'dzbanek',      nazwa: 'Dzbanek',          kolor: '#e5989b', bonus: 2, cena: 250 },\n  { id: 'koszyk',       nazwa: 'Koszyk',           kolor: '#d9a066', bonus: 2, cena: 330 },\n  { id: 'papier',       nazwa: 'Papier ozdobny',   kolor: '#e8c4b0', bonus: 3, cena: 430 },\n  { id: 'folia',        nazwa: 'Folia',            kolor: '#f1faee', bonus: 3, cena: 550 },\n]\n\nexport const EXTRAS = [\n  { id: 'kokarda',          nazwa: 'Kokarda',    kolor: '#e63946', wartosc: 2, cena: 0,  skala: 0.85, start: true },\n  { id: 'wstazka',          nazwa: 'Wstążka',    kolor: '#ff7aa2', wartosc: 1, cena: 55, skala: 1.0 },\n  { id: 'drut',             nazwa: 'Linka',      kolor: '#ffd166', wartosc: 1, cena: 55, skala: 1.0 },\n  { id: 'perelki',          nazwa: 'Perełki',    kolor: '#ffffff', wartosc: 1, cena: 90, skala: 0.95 },\n  { id: 'serduszko',        nazwa: 'Serduszko',  kolor: '#e63946', wartosc: 1, cena: 130, skala: 0.7 },\n  { id: 'gwiazdka_ozdoba',  nazwa: 'Gwiazdka',   kolor: '#ffd166', wartosc: 1, cena: 170, skala: 0.7 },\n  { id: 'motylek',          nazwa: 'Motylek',    kolor: '#4cc9f0', wartosc: 2, cena: 220, skala: 0.75 },\n  { id: 'biedronka',        nazwa: 'Biedronka',  kolor: '#e63946', wartosc: 2, cena: 280, skala: 0.55 },\n]\n\n// Jedno pokrętło do przeskalowania całego sklepiku. 1 = ceny jak wyżej,\n// 0.5 = wszystko dwa razy tańsze, 2 = dwa razy droższe.\nexport const MNOZNIK_CEN = 1\n\nif (MNOZNIK_CEN !== 1) {\n  for (const lista of [FLOWERS, LEAVES, VASES_CATALOG, EXTRAS]) {\n    for (const poz of lista) poz.cena = Math.round(poz.cena * MNOZNIK_CEN)\n  }\n}\n\n// szybkie wyszukiwanie po id\nexport const BY_ID = {\n  flower: Object.fromEntries(FLOWERS.map((f) => [f.id, f])),\n  leaf: Object.fromEntries(LEAVES.map((f) => [f.id, f])),\n  vase: Object.fromEntries(VASES_CATALOG.map((f) => [f.id, f])),\n  extra: Object.fromEntries(EXTRAS.map((f) => [f.id, f])),\n}\n\nexport const CATALOG_LIST = { flower: FLOWERS, leaf: LEAVES, vase: VASES_CATALOG, extra: EXTRAS }\n\n// Punkt styku lodygi z kwiatem (pole `nasada` przy kwiatach) podawany jest\n// w jednostkach rysunku 0-100; brak pola oznacza srodek ikony.\nexport const SRODEK_IKONY = { x: 50, y: 50 }\n\n// Domyslna nasada: dol glowki, nie jej srodek. Dzieki temu lodyga podchodzi\n// do kwiatu OD DOLU i widac ja spod platkow, zamiast chowac sie calkiem za nimi.\nexport const NASADA_DOMYSLNA = { x: 50, y: 76 }\n\n// Bazowa wielkosc elementu na stole, w % szerokosci sceny.\n// Uzywaja jej Workbench, BouquetPreview i logika sadzenia lisci.\nexport const ROZMIAR_ELEMENTU = { flower: 21, leaf: 25, extra: 20 }\n\n// Lisc obraca sie wokol punktu 84% swojej wysokosci (patrz Workbench),\n// wiec jego nasada lezy 8.5 jednostki ponizej srodka.\nexport const NASADA_LISCIA = ROZMIAR_ELEMENTU.leaf * (0.84 - 0.5)\n\nexport const KATEGORIE = [\n  { key: 'flower', label: 'Kwiaty', emoji: '🌸' },\n  { key: 'leaf', label: 'Liście', emoji: '🌿' },\n  { key: 'vase', label: 'Wazony', emoji: '🏺' },\n  { key: 'extra', label: 'Dodatki', emoji: '🎀' },\n]\n\n// Ile elementów zmieści się na jednym bukiecie. Każda kategoria ma WŁASNĄ pulę,\n// żeby zieleń nie zabierała miejsca kwiatom.\nexport const LIMIT_KWIATOW = 15\nexport const LIMIT_LISCI = 15\nexport const LIMIT_DODATKOW = 6\n\n// --- Reguła wyceny bukietu (prosta, zeby dalo sie ja wytlumaczyc dziecku) ---\n// 1. Pierwszy kwiat danego gatunku jest wart tyle, ile ma w katalogu.\n// 2. Każdy KOLEJNY taki sam kwiat jest wart tylko 1 gwiazdkę.\n//    (bez tego dało się wsadzić same lwie paszcze i drukować gwiazdki)\n// 3. Za każdy różny gatunek kwiatu +1 gwiazdka — premia za różnorodność.\n// 4. Liście: 1 gwiazdka za każdy RÓŻNY rodzaj, powtórki gratis.\n// 5. Dodatki: liczy się każdy różny rodzaj, powtórki gratis.\n// 6. Wazon/opakowanie dokłada swój bonus.\n// 7. Bukiet musi mieć min. 3 kwiaty, żeby dało się go sprzedać.\nexport function wycen(bukiet, vaseId) {\n  const kwiaty = bukiet.filter((b) => b.kind === 'flower')\n  const liscie = bukiet.filter((b) => b.kind === 'leaf')\n  const dodatki = bukiet.filter((b) => b.kind === 'extra')\n\n  const widziane = new Set()\n  let zaKwiaty = 0\n  let powtorki = 0\n  for (const b of kwiaty) {\n    if (widziane.has(b.id)) {\n      zaKwiaty += 1\n      powtorki += 1\n    } else {\n      widziane.add(b.id)\n      zaKwiaty += BY_ID.flower[b.id]?.wartosc ?? 1\n    }\n  }\n\n  const gatunki = widziane.size\n  const zaRoznorodnosc = gatunki\n  const zaLiscie = new Set(liscie.map((b) => b.id)).size\n  const zaDodatki = [...new Set(dodatki.map((b) => b.id))].reduce(\n    (suma, id) => suma + (BY_ID.extra[id]?.wartosc ?? 1),\n    0\n  )\n  const zaWazon = BY_ID.vase[vaseId]?.bonus ?? 0\n\n  return {\n    zaKwiaty,\n    powtorki,\n    zaLiscie,\n    zaDodatki,\n    gatunki,\n    zaRoznorodnosc,\n    zaWazon,\n    razem: zaKwiaty + zaLiscie + zaDodatki + zaRoznorodnosc + zaWazon,\n    mozna: kwiaty.length >= 3,\n    liczbaKwiatow: kwiaty.length,\n  }\n}\n", "src/sound.js": "// Krotkie efekty dzwiekowe generowane w WebAudio - zero plikow mp3 do pobrania.\nlet ctx = null\nlet wlaczony = true\n\nfunction audio() {\n  if (typeof window === 'undefined') return null\n  if (!ctx) {\n    const AC = window.AudioContext || window.webkitAudioContext\n    if (!AC) return null\n    ctx = new AC()\n  }\n  if (ctx.state === 'suspended') ctx.resume()\n  return ctx\n}\n\nfunction ton(freq, start, dur, gain = 0.16, typ = 'sine') {\n  const ac = audio()\n  if (!ac) return\n  const o = ac.createOscillator()\n  const g = ac.createGain()\n  o.type = typ\n  o.frequency.setValueAtTime(freq, ac.currentTime + start)\n  g.gain.setValueAtTime(0, ac.currentTime + start)\n  g.gain.linearRampToValueAtTime(gain, ac.currentTime + start + 0.012)\n  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur)\n  o.connect(g).connect(ac.destination)\n  o.start(ac.currentTime + start)\n  o.stop(ac.currentTime + start + dur + 0.02)\n}\n\nexport const dzwiek = {\n  ustawWlaczony(v) { wlaczony = v },\n  czyWlaczony() { return wlaczony },\n  klik() { if (wlaczony) ton(880, 0, 0.09, 0.1, 'triangle') },\n  polozenie() { if (wlaczony) { ton(660, 0, 0.09, 0.09, 'sine'); ton(990, 0.05, 0.1, 0.07, 'sine') } },\n  kosz() { if (wlaczony) { ton(300, 0, 0.09, 0.12, 'sawtooth'); ton(180, 0.07, 0.14, 0.1, 'sawtooth') } },\n  sprzedaz() {\n    if (!wlaczony) return\n    ;[523.25, 659.25, 783.99, 1046.5].forEach((f, i) => ton(f, i * 0.085, 0.28, 0.14, 'triangle'))\n  },\n  zapis() { if (wlaczony) { ton(587.33, 0, 0.15, 0.12, 'sine'); ton(880, 0.1, 0.22, 0.11, 'sine') } },\n  zakup() { if (wlaczony) { ton(784, 0, 0.12, 0.13, 'square'); ton(1046.5, 0.09, 0.2, 0.1, 'triangle') } },\n  blad() { if (wlaczony) ton(220, 0, 0.18, 0.1, 'square') },\n}\n", "src/art/flowers.jsx": "// Glowki kwiatow rysowane jako SVG w kodzie.\n// Kazdy ksztalt dostaje wyliczona palete odcieni (c) i rysuje sie w ukladzie 100x100,\n// srodek kwiatu = punkt (50,50). Dzieki temu zmiana koloru = jeden props, bez podmiany plikow.\nimport React from 'react'\nimport { palette } from '../data/colors'\n\nconst GOLD = '#f9c74f'\nconst GOLD_D = '#f3a712'\nconst DARK = '#5a3d52'\n\n// N platkow rozlozonych w kole wokol (50,50)\nconst ring = (n, render, start = 0) =>\n  Array.from({ length: n }, (_, i) => (\n    <g key={i} transform={`rotate(${start + (i * 360) / n} 50 50)`}>{render(i)}</g>\n  ))\n\n// Maly kwiatuszek (uzywany w baldachach: hortensja, werbena, gipsowka, iberis...)\nconst floret = (cx, cy, r, n, fill, center, key) => (\n  <g key={key}>\n    {Array.from({ length: n }, (_, i) => (\n      <ellipse\n        key={i}\n        cx={cx}\n        cy={cy - r * 0.6}\n        rx={r * 0.46}\n        ry={r * 0.62}\n        fill={fill}\n        transform={`rotate(${(i * 360) / n + (key || 0) * 11} ${cx} ${cy})`}\n      />\n    ))}\n    {center && <circle cx={cx} cy={cy} r={r * 0.3} fill={center} />}\n  </g>\n)\n\nconst SHAPES = {\n  roza: (c) => (\n    <g>\n      {ring(7, () => <circle cx=\"50\" cy=\"30\" r=\"15\" fill={c.base} />)}\n      {ring(6, () => <circle cx=\"50\" cy=\"37\" r=\"12.5\" fill={c.light} />, 26)}\n      <circle cx=\"50\" cy=\"50\" r=\"20\" fill={c.base} />\n      <path\n        d=\"M50 50 C56 50 58 43 52 40 C44 36 38 45 42 53 C47 63 60 60 63 50 C67 37 54 28 42 32 C28 37 24 54 32 65\"\n        fill=\"none\"\n        stroke={c.deep}\n        strokeWidth=\"4\"\n        strokeLinecap=\"round\"\n      />\n    </g>\n  ),\n\n  rumianek: (c) => (\n    <g>\n      {ring(16, () => <ellipse cx=\"50\" cy=\"24\" rx=\"4\" ry=\"19\" fill={c.base} />)}\n      {ring(16, () => <ellipse cx=\"50\" cy=\"29\" rx=\"2.6\" ry=\"14\" fill={c.light} />, 11)}\n      <circle cx=\"50\" cy=\"50\" r=\"11\" fill={GOLD} />\n      <circle cx=\"50\" cy=\"50\" r=\"6.5\" fill={GOLD_D} />\n    </g>\n  ),\n\n  tulipan: (c) => (\n    <g>\n      <path d=\"M50 76 C40 74 29 62 27 46 C25 32 32 22 38 25 C44 28 45 50 50 76Z\" fill={c.dark} />\n      <path d=\"M50 76 C60 74 71 62 73 46 C75 32 68 22 62 25 C56 28 55 50 50 76Z\" fill={c.light} />\n      <path d=\"M50 20 C61 20 67 33 65 49 C63 64 57 77 50 77 C43 77 37 64 35 49 C33 33 39 20 50 20Z\" fill={c.base} />\n      <path d=\"M50 24 C55 30 56 44 53 60\" fill=\"none\" stroke={c.deep} strokeWidth=\"2.5\" strokeLinecap=\"round\" opacity=\"0.6\" />\n    </g>\n  ),\n\n  hortensja: (c) => (\n    <g>\n      <circle cx=\"50\" cy=\"50\" r=\"34\" fill={c.deep} opacity=\"0.28\" />\n      {[\n        [50, 26, 12], [30, 36, 12], [70, 36, 12], [24, 57, 12], [76, 57, 12],\n        [38, 72, 12], [62, 72, 12], [50, 50, 13], [36, 52, 11], [64, 52, 11],\n      ].map(([x, y, r], i) => floret(x, y, r, 4, i % 3 === 0 ? c.light : i % 3 === 1 ? c.base : c.dark, GOLD, i))}\n    </g>\n  ),\n\n  lupinus: (c) => (\n    <g>\n      {Array.from({ length: 11 }, (_, i) => {\n        const y = 9 + i * 8.2\n        const w = 1.5 + i * 1.35\n        const r = 5.4 + i * 0.28\n        return (\n          <g key={i}>\n            <ellipse cx={50 - w} cy={y} rx={r * 1.25} ry={r} fill={i % 2 ? c.dark : c.base} transform={`rotate(-26 ${50 - w} ${y})`} />\n            <ellipse cx={50 + w} cy={y + 2} rx={r * 1.25} ry={r} fill={i % 2 ? c.base : c.light} transform={`rotate(26 ${50 + w} ${y + 2})`} />\n            <ellipse cx=\"50\" cy={y + 4} rx={r * 1.1} ry={r * 0.9} fill={i % 2 ? c.light : c.deep} />\n          </g>\n        )\n      })}\n      <ellipse cx=\"50\" cy=\"6\" rx=\"4.5\" ry=\"6\" fill={c.light} />\n    </g>\n  ),\n\n  gipsowka: (c) => (\n    <g>\n      <path d=\"M50 72 L50 20 M50 68 L30 48 M50 68 L70 48 M50 56 L36 30 M50 56 L64 30\"\n        fill=\"none\" stroke=\"#8aa17a\" strokeWidth=\"2\" strokeLinecap=\"round\" />\n      {[[30, 46, 9], [70, 46, 9], [36, 28, 8], [64, 28, 8], [50, 18, 9], [50, 58, 8], [42, 40, 7], [58, 40, 7], [22, 62, 7], [78, 62, 7]]\n        .map(([x, y, r], i) => floret(x, y, r, 5, i % 2 ? c.base : c.light, c.dark, i))}\n    </g>\n  ),\n\n  stokrotka: (c) => (\n    <g>\n      {ring(12, () => <ellipse cx=\"50\" cy=\"27\" rx=\"7.5\" ry=\"17\" fill={c.base} />)}\n      {ring(12, () => <ellipse cx=\"50\" cy=\"31\" rx=\"5\" ry=\"13\" fill={c.light} />, 15)}\n      <circle cx=\"50\" cy=\"50\" r=\"12\" fill={GOLD} />\n      <circle cx=\"50\" cy=\"50\" r=\"7\" fill={GOLD_D} />\n    </g>\n  ),\n\n  cynia: (c) => (\n    <g>\n      {ring(11, () => <ellipse cx=\"50\" cy=\"26\" rx=\"8\" ry=\"18\" fill={c.dark} />)}\n      {ring(11, () => <ellipse cx=\"50\" cy=\"33\" rx=\"7.5\" ry=\"15\" fill={c.base} />, 16)}\n      {ring(9, () => <ellipse cx=\"50\" cy=\"40\" rx=\"6\" ry=\"10\" fill={c.light} />, 8)}\n      <circle cx=\"50\" cy=\"50\" r=\"8.5\" fill={GOLD} />\n      {ring(8, () => <circle cx=\"50\" cy=\"44\" r=\"2.4\" fill={GOLD_D} />)}\n    </g>\n  ),\n\n  jasmin: (c) => (\n    <g>\n      <path d=\"M50 80 L50 62 M50 74 L32 56 M50 74 L68 56\" fill=\"none\" stroke=\"#7f9172\" strokeWidth=\"2.4\" strokeLinecap=\"round\" />\n      {[[32, 50, 17], [68, 50, 17], [50, 26, 19]].map(([x, y, r], i) => (\n        <g key={i}>\n          {Array.from({ length: 6 }, (_, j) => (\n            <ellipse key={j} cx={x} cy={y - r * 0.58} rx={r * 0.3} ry={r * 0.6} fill={j % 2 ? c.base : c.light}\n              transform={`rotate(${(j * 360) / 6 + i * 13} ${x} ${y})`} />\n          ))}\n          <circle cx={x} cy={y} r={r * 0.24} fill={GOLD} />\n        </g>\n      ))}\n    </g>\n  ),\n\n  antirrhinum: (c) => (\n    <g>\n      <path d=\"M50 88 L50 18\" fill=\"none\" stroke=\"#7f9172\" strokeWidth=\"2.6\" strokeLinecap=\"round\" />\n      {Array.from({ length: 5 }, (_, i) => {\n        const y = 18 + i * 17\n        const s = 0.62 + i * 0.11\n        const bok = i % 2 ? 1 : -1\n        return (\n          <g key={i} transform={`translate(${50 + bok * 11 * s} ${y}) scale(${s}) rotate(${bok * 20})`}>\n            {/* dolna warga - szeroka, ciemniejsza */}\n            <path d=\"M-20 0 C-24 16 -12 26 0 26 C12 26 24 16 20 0 Z\" fill={c.dark} />\n            {/* gardziel */}\n            <ellipse cx=\"0\" cy=\"2\" rx=\"13\" ry=\"9\" fill={c.deep} />\n            <ellipse cx=\"0\" cy=\"1\" rx=\"7\" ry=\"4.5\" fill={GOLD} />\n            {/* gorna warga - jasna, dwa platy */}\n            <path d=\"M-20 1 C-23 -14 -13 -24 -4 -22 C-1 -21 -1 -12 -2 1 Z\" fill={c.light} />\n            <path d=\"M20 1 C23 -14 13 -24 4 -22 C1 -21 1 -12 2 1 Z\" fill={c.base} />\n          </g>\n        )\n      })}\n      <ellipse cx=\"50\" cy=\"11\" rx=\"5\" ry=\"7\" fill={c.light} />\n    </g>\n  ),\n\n  polygonum: (c) => (\n    <g>\n      <path d=\"M49 92 C45 76 56 44 50 10\" fill=\"none\" stroke=\"#7f9172\" strokeWidth=\"2.8\" strokeLinecap=\"round\" />\n      {Array.from({ length: 16 }, (_, i) => {\n        const t = i / 15\n        // ta sama krzywa co lodyga - kwiatuszki siedza na niej\n        const y = 10 + t * 84\n        const x = 50 - 6 * Math.sin(t * Math.PI * 1.15) + (t > 0.55 ? (t - 0.55) * 10 : 0)\n        const r = 3.4 + t * 1.9\n        return (\n          <g key={i}>\n            <circle cx={x - r * 0.85} cy={y} r={r} fill={i % 2 ? c.base : c.light} />\n            <circle cx={x + r * 0.85} cy={y + 1.5} r={r} fill={i % 2 ? c.dark : c.base} />\n            <circle cx={x} cy={y + 2.6} r={r * 0.8} fill={i % 2 ? c.light : c.deep} />\n          </g>\n        )\n      })}\n    </g>\n  ),\n\n  narcyz: (c) => (\n    <g>\n      {ring(6, () => <ellipse cx=\"50\" cy=\"27\" rx=\"11\" ry=\"17\" fill={c.base} />)}\n      {ring(6, () => <ellipse cx=\"50\" cy=\"30\" rx=\"7\" ry=\"13\" fill={c.light} />, 30)}\n      <circle cx=\"50\" cy=\"50\" r=\"16\" fill={GOLD} />\n      <circle cx=\"50\" cy=\"50\" r=\"11.5\" fill={GOLD_D} />\n      <circle cx=\"50\" cy=\"50\" r=\"6.5\" fill=\"#e07a1f\" />\n    </g>\n  ),\n\n  godecja: (c) => (\n    <g>\n      {ring(4, () => <ellipse cx=\"50\" cy=\"30\" rx=\"19\" ry=\"21\" fill={c.base} />, 45)}\n      {ring(4, () => <ellipse cx=\"50\" cy=\"36\" rx=\"11\" ry=\"14\" fill={c.deep} opacity=\"0.55\" />, 45)}\n      <circle cx=\"50\" cy=\"50\" r=\"9\" fill={c.light} />\n      {ring(5, () => <ellipse cx=\"50\" cy=\"45\" rx=\"1.8\" ry=\"4\" fill={GOLD} />)}\n      <circle cx=\"50\" cy=\"50\" r=\"3.5\" fill={GOLD_D} />\n    </g>\n  ),\n\n  kosmos: (c) => (\n    <g>\n      {ring(8, () => (\n        <path d=\"M50 50 C36 42 33 22 41 12 L50 19 L59 12 C67 22 64 42 50 50Z\" fill={c.base} />\n      ))}\n      {ring(8, () => (\n        <path d=\"M50 50 C43 44 41 32 45 25 L50 29 L55 25 C59 32 57 44 50 50Z\" fill={c.light} opacity=\"0.75\" />\n      ))}\n      <circle cx=\"50\" cy=\"50\" r=\"10\" fill={GOLD} />\n      {ring(7, () => <circle cx=\"50\" cy=\"45\" r=\"2.2\" fill={GOLD_D} />)}\n    </g>\n  ),\n\n  brachycome: (c) => (\n    <g>\n      {ring(20, () => <ellipse cx=\"50\" cy=\"25\" rx=\"3.2\" ry=\"19\" fill={c.base} />)}\n      {ring(20, () => <ellipse cx=\"50\" cy=\"30\" rx=\"2\" ry=\"14\" fill={c.light} />, 9)}\n      <circle cx=\"50\" cy=\"50\" r=\"10\" fill={DARK} />\n      <circle cx=\"50\" cy=\"50\" r=\"6\" fill={GOLD_D} />\n    </g>\n  ),\n\n  frezja: (c) => (\n    <g>\n      <path d=\"M25 82 C27 70 34 52 56 34 C68 24 78 20 86 18\" fill=\"none\" stroke=\"#7f9172\" strokeWidth=\"3\" strokeLinecap=\"round\" />\n      {[[26, 74, -35, 1], [38, 56, -18, 0.95], [54, 42, 5, 0.9], [70, 30, 25, 0.8], [84, 22, 45, 0.62]].map(([x, y, r, s], i) => (\n        <g key={i} transform={`translate(${x} ${y}) rotate(${r}) scale(${s})`}>\n          <path d=\"M0 4 C-4 -6 -12 -11 -13 -19 C-14 -27 -7 -31 0 -31 C7 -31 14 -27 13 -19 C12 -11 4 -6 0 4Z\" fill={i % 2 ? c.base : c.light} />\n          <ellipse cx=\"0\" cy=\"-28\" rx=\"13\" ry=\"7\" fill={c.dark} opacity=\"0.5\" />\n          <ellipse cx=\"0\" cy=\"-30\" rx=\"9\" ry=\"4.5\" fill={GOLD} opacity=\"0.8\" />\n        </g>\n      ))}\n    </g>\n  ),\n\n  bellis: (c) => (\n    <g>\n      {ring(22, () => <ellipse cx=\"50\" cy=\"26\" rx=\"3\" ry=\"18\" fill={c.base} />)}\n      {ring(18, () => <ellipse cx=\"50\" cy=\"32\" rx=\"2.6\" ry=\"13\" fill={c.light} />, 9)}\n      {ring(14, () => <ellipse cx=\"50\" cy=\"39\" rx=\"2.2\" ry=\"8\" fill={c.dark} />, 12)}\n      <circle cx=\"50\" cy=\"50\" r=\"8\" fill={GOLD} />\n      <circle cx=\"50\" cy=\"50\" r=\"4.5\" fill={GOLD_D} />\n    </g>\n  ),\n\n  viola: (c) => (\n    <g>\n      {/* dwa gorne platki - najciemniejsze */}\n      <ellipse cx=\"32\" cy=\"29\" rx=\"18\" ry=\"17\" fill={c.dark} transform=\"rotate(-16 32 29)\" />\n      <ellipse cx=\"68\" cy=\"29\" rx=\"18\" ry=\"17\" fill={c.dark} transform=\"rotate(16 68 29)\" />\n      {/* dwa boczne */}\n      <ellipse cx=\"23\" cy=\"55\" rx=\"19\" ry=\"17\" fill={c.base} transform=\"rotate(-22 23 55)\" />\n      <ellipse cx=\"77\" cy=\"55\" rx=\"19\" ry=\"17\" fill={c.base} transform=\"rotate(22 77 55)\" />\n      {/* duzy dolny - najjasniejszy */}\n      <ellipse cx=\"50\" cy=\"71\" rx=\"25\" ry=\"21\" fill={c.light} />\n      {/* ciemna \"buzia\" bratka - mala, zeby platki byly widoczne */}\n      <path d=\"M50 42 C60 42 65 54 60 65 C56 74 44 74 40 65 C35 54 40 42 50 42Z\" fill={c.deep} />\n      <circle cx=\"50\" cy=\"49\" r=\"8\" fill={GOLD} />\n      <circle cx=\"50\" cy=\"49\" r=\"4\" fill={GOLD_D} />\n      {[-24, 0, 24].map((a, i) => (\n        <path key={i} d=\"M50 54 L50 72\" stroke={c.line} strokeWidth=\"2.6\" strokeLinecap=\"round\"\n          transform={`rotate(${a} 50 54)`} />\n      ))}\n    </g>\n  ),\n\n  werbena: (c) => (\n    <g>\n      <circle cx=\"50\" cy=\"50\" r=\"33\" fill={c.deep} opacity=\"0.22\" />\n      {[[50, 24, 11], [27, 38, 11], [73, 38, 11], [27, 63, 11], [73, 63, 11], [50, 77, 11], [50, 50, 12]]\n        .map(([x, y, r], i) => floret(x, y, r, 5, i % 2 ? c.base : c.light, i % 2 ? '#fff8e7' : GOLD, i))}\n    </g>\n  ),\n\n  szafirek: (c) => (\n    <g>\n      {Array.from({ length: 9 }, (_, i) => {\n        const y = 11 + i * 9.4\n        const w = 1 + i * 1.5\n        const r = 4.6 + i * 0.42\n        return (\n          <g key={i}>\n            <circle cx={50 - w} cy={y} r={r} fill={i % 2 ? c.dark : c.base} />\n            <circle cx={50 + w} cy={y + 3} r={r} fill={i % 2 ? c.base : c.light} />\n            <circle cx=\"50\" cy={y + 5} r={r * 0.92} fill={i % 2 ? c.light : c.deep} />\n            <ellipse cx={50 - w} cy={y + r * 0.55} rx={r * 0.5} ry={r * 0.26} fill=\"#fff\" opacity=\"0.5\" />\n          </g>\n        )\n      })}\n      <circle cx=\"50\" cy=\"6\" r=\"3.6\" fill={c.light} />\n    </g>\n  ),\n\n  iberis: (c) => (\n    <g>\n      <path d=\"M50 74 L50 62\" fill=\"none\" stroke=\"#7f9172\" strokeWidth=\"3\" strokeLinecap=\"round\" />\n      {[[24, 40, 11], [40, 30, 11], [58, 28, 11], [75, 38, 11], [32, 54, 11], [50, 47, 12], [68, 54, 11], [42, 66, 10], [60, 66, 10]]\n        .map(([x, y, r], i) => floret(x, y, r, 4, i % 2 ? c.base : c.light, c.dark, i))}\n    </g>\n  ),\n\n  // Nagroda koncowa - gesta, wielowarstwowa piwonia\n  piwonia: (c) => (\n    <g>\n      {ring(9, () => <ellipse cx=\"50\" cy=\"24\" rx=\"14.5\" ry=\"19\" fill={c.deep} />)}\n      {ring(9, () => <ellipse cx=\"50\" cy=\"29\" rx=\"13\" ry=\"16\" fill={c.dark} />, 20)}\n      {ring(9, () => <ellipse cx=\"50\" cy=\"35\" rx=\"11.5\" ry=\"13\" fill={c.base} />, 10)}\n      {ring(8, () => <ellipse cx=\"50\" cy=\"40\" rx=\"9.5\" ry=\"10.5\" fill={c.light} />, 24)}\n      {ring(7, () => <ellipse cx=\"50\" cy=\"44\" rx=\"7.5\" ry=\"8\" fill={c.base} />, 12)}\n      {ring(6, () => <ellipse cx=\"50\" cy=\"47\" rx=\"5.5\" ry=\"6\" fill={c.dark} />, 28)}\n      <circle cx=\"50\" cy=\"50\" r=\"7.5\" fill={GOLD} />\n      {ring(10, () => <circle cx=\"50\" cy=\"45.5\" r=\"1.7\" fill={GOLD_D} />)}\n      <circle cx=\"50\" cy=\"50\" r=\"3.2\" fill={GOLD_D} />\n    </g>\n  ),\n\n  nicotiana: (c) => (\n    <g>\n      {ring(5, () => <path d=\"M50 50 L41 24 L50 8 L59 24 Z\" fill={c.base} />)}\n      {ring(5, () => <path d=\"M50 50 L45 30 L50 18 L55 30 Z\" fill={c.light} />)}\n      <circle cx=\"50\" cy=\"50\" r=\"12\" fill={c.deep} />\n      <circle cx=\"50\" cy=\"50\" r=\"7\" fill={GOLD} />\n      <circle cx=\"50\" cy=\"50\" r=\"3.5\" fill={GOLD_D} />\n    </g>\n  ),\n}\n\nexport const FLOWER_IDS = Object.keys(SHAPES)\n\nexport function FlowerArt({ id, color = '#ff7aa2', size = 100, style }) {\n  const shape = SHAPES[id] || SHAPES.stokrotka\n  return (\n    <svg viewBox=\"0 0 100 100\" width={size} height={size} style={style} aria-hidden=\"true\">\n      {shape(palette(color))}\n    </svg>\n  )\n}\n", "src/art/leaves.jsx": "// Liscie i zielen - rysowane jako SVG, srodek galazki w punkcie (50,50).\nimport React from 'react'\nimport { palette } from '../data/colors'\n\nconst SHAPES = {\n  eukaliptus: (c) => (\n    <g>\n      {/* dluga lodyga - dolny odcinek celowo bez lisci */}\n      <path d=\"M50 99 C46 76 54 50 50 5\" fill=\"none\" stroke={c.deep} strokeWidth=\"3\" strokeLinecap=\"round\" />\n      {Array.from({ length: 9 }, (_, i) => {\n        const y = 10 + i * 6.4\n        const side = i % 2 ? 1 : -1\n        const r = 5.4 + i * 0.62\n        const x = 50 + side * (6 + i * 0.8)\n        return (\n          <g key={i}>\n            <path d={`M50 ${y + 2} L${x} ${y}`} stroke={c.deep} strokeWidth=\"1.8\" strokeLinecap=\"round\" />\n            <ellipse cx={x + side * r * 0.75} cy={y} rx={r} ry={r * 0.86} fill={i % 2 ? c.base : c.light} />\n          </g>\n        )\n      })}\n      <ellipse cx=\"50\" cy=\"7\" rx=\"5.4\" ry=\"5.4\" fill={c.light} />\n    </g>\n  ),\n\n  // Zwykly listek - najprostsza zielen, dostepna od poczatku\n  listek: (c) => (\n    <g>\n      <path d=\"M50 98 C48 90 49 84 50 80\" fill=\"none\" stroke={c.deep} strokeWidth=\"3\" strokeLinecap=\"round\" />\n      <path d=\"M50 6 C66 20 73 40 68 58 C64 72 55 80 50 84 C45 80 36 72 32 58 C27 40 34 20 50 6Z\" fill={c.base} />\n      <path d=\"M50 6 C66 20 73 40 68 58 C64 72 55 80 50 84 Z\" fill={c.dark} />\n      <path d=\"M50 10 L50 82\" stroke={c.deep} strokeWidth=\"2.2\" strokeLinecap=\"round\" />\n      {[22, 34, 46, 58, 68].map((y, i) => (\n        <g key={y}>\n          <path d={`M50 ${y} C${44 - i} ${y + 3} ${39 - i} ${y + 7} ${36 - i * 0.6} ${y + 12}`}\n            fill=\"none\" stroke={c.deep} strokeWidth=\"1.3\" opacity=\"0.55\" strokeLinecap=\"round\" />\n          <path d={`M50 ${y} C${56 + i} ${y + 3} ${61 + i}      <ellipse key={i} cx={x} cy={y} rx=\"5\" ry=\"9\" fill={c.dark} opacity=\"0.8\" transform={`rotate(${(i - 1) * 18} ${x} ${y})`} />\n      ))}\n    </g>\n  ),\n}\n\nexport const LEAF_IDS = Object.keys(SHAPES)\n\nexport function LeafArt({ id, color = '#40916c', size = 100, style }) {\n  const shape = SHAPES[id] || SHAPES.eukaliptus\n  return (\n    <svg viewBox=\"0 0 100 100\" width={size} height={size} style={style} aria-hidden=\"true\">\n      {shape(palette(color))}\n    </svg>\n  )\n}\n", "src/art/extras.jsx": "// Dodatki: wstazki, kokardy, drobiazgi. Rysowane wokol punktu (50,50).\nimport React from 'react'\nimport { palette } from '../data/colors'\n\nconst SHAPES = {\n  kokarda: (c) => (\n    <g>\n      <path d=\"M50 50 C34 30 8 32 10 48 C12 64 36 62 50 50Z\" fill={c.base} />\n      <path d=\"M50 50 C66 30 92 32 90 48 C88 64 64 62 50 50Z\" fill={c.base} />\n      <path d=\"M50 50 C36 34 14 36 13 47 C22 40 38 42 50 50Z\" fill={c.light} />\n      <path d=\"M50 50 C64 34 86 36 87 47 C78 40 62 42 50 50Z\" fill={c.light} />\n      <path d=\"M44 54 L30 88 L44 82 L48 92 Z\" fill={c.dark} />\n      <path d=\"M56 54 L70 88 L56 82 L52 92 Z\" fill={c.dark} />\n      <ellipse cx=\"50\" cy=\"50\" rx=\"10\" ry=\"9\" fill={c.deep} />\n    </g>\n  ),\n\n  wstazka: (c) => (\n    <g>\n      <path d=\"M4 42 C26 28 74 28 96 42 L96 58 C74 44 26 44 4 58 Z\" fill={c.base} />\n      <path d=\"M4 42 C26 28 74 28 96 42 L96 48 C74 34 26 34 4 48 Z\" fill={c.light} />\n      <path d=\"M40 44 L28 26 L50 40 L72 26 L60 44 Z\" fill={c.dark} />\n    </g>\n  ),\n\n  drut: (c) => (\n    <g>\n      <path d=\"M6 78 C22 46 34 92 48 56 C60 26 70 78 84 44 C90 30 94 34 96 30\"\n        fill=\"none\" stroke={c.base} strokeWidth=\"4\" strokeLinecap=\"round\" />\n      {[[20, 62], [46, 60], [72, 56], [92, 32]].map(([x, y], i) => (\n        <circle key={i} cx={x} cy={y} r=\"4.5\" fill={c.light} />\n      ))}\n    </g>\n  ),\n\n  perelki: (c) => (\n    <g>\n      {[[10, 60], [24, 48], [39, 42], [55, 44],
